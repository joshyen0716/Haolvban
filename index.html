<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>好旅伴 · 出國準備</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#11151c;
  --surface:#181d26;
  --surface-2:#1f2530;
  --surface-3:#262d3a;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);
  --text:#EDEAE2;
  --text-dim:#9BA1AE;
  --text-faint:#6B7180;
  --gold:#D4A24C;
  --gold-dim:rgba(212,162,76,0.16);
  --rust:#C1554B;
  --rust-dim:rgba(193,85,75,0.16);
  --sage:#7FA37F;
  --sage-dim:rgba(127,163,127,0.16);
  --g0:#D4A24C;
  --g1:#C98A94;
  --g2:#7FA37F;
  --g3:#9A8FC2;
  --g4:#6E93B7;
  --radius:10px;
  --serif:'Microsoft JhengHei','Spectral',Georgia,serif;
  --sans:'Microsoft JhengHei','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Microsoft JhengHei','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(212,162,76,0.06), transparent 60%), var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-dim);color:var(--gold);}
a{color:inherit;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;color:var(--text);background-color:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.serif{font-family:var(--serif);}

#app{max-width:1280px;margin:0 auto;padding:0 20px 80px;}
.topbar{position:static;background:rgba(17,21,28,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1280px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;}
.brand-mark{font-family:var(--serif);font-weight:700;font-style:italic;font-size:22px;color:var(--gold);letter-spacing:0.5px;}
.brand-sub{font-size:11px;color:var(--text-faint);letter-spacing:2px;text-transform:uppercase;font-family:var(--mono);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.backup-actions{display:flex;gap:8px;}

.btn{padding:10px 18px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--surface-3);}
.btn-primary{background:var(--gold);border-color:var(--gold);color:#1a1508;}
.btn-primary:hover{background:#e0ad57;}
.btn-danger{background:transparent;border-color:var(--rust);color:var(--rust);}
.btn-danger:hover{background:var(--rust-dim);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);cursor:pointer;}
.btn-icon:hover{color:var(--text);border-color:var(--border-strong);}
.btn-icon.icon-danger{background:var(--rust-dim);border-color:rgba(193,85,75,0.35);color:var(--rust);}
.btn-icon.icon-danger:hover{background:rgba(193,85,75,0.3);border-color:var(--rust);color:#fff;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.view{display:none;animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- home layout ---------- */
.home-stack{margin-top:20px;max-width:900px;}
@media(min-width:1100px){.home-stack{max-width:1100px;}}

.ov-cal-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 18px;margin-bottom:18px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-family:var(--serif);font-size:19px;font-weight:600;}
.cal-nav{display:flex;align-items:center;gap:6px;}
.cal-today-btn{font-size:11px;color:var(--text-dim);font-family:var(--mono);}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-faint);font-family:var(--mono);letter-spacing:1px;padding-bottom:6px;}
.cal-cell{position:relative;min-height:64px;min-width:0;border-radius:8px;border:1px solid transparent;padding:6px 6px 8px;background:var(--surface-2);cursor:default;transition:border-color .15s;overflow:hidden;}
.cal-cell.empty{background:transparent;}
.cal-cell.has-trip{cursor:pointer;}
.cal-cell.has-trip:hover{border-color:var(--border-strong);}
.cal-cell[data-cal-day]{cursor:pointer;}
.cal-cell[data-cal-day]:hover{border-color:var(--border-strong);}
.cal-todo-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:4px;}
.cal-cell.is-selected{border-color:var(--gold);background:var(--gold-dim);}
.cal-cell.is-today{border-color:var(--gold);}
.cal-daynum{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
.cal-cell.is-today .cal-daynum{color:var(--gold);font-weight:700;}
.cal-trip-label{margin-top:5px;font-size:10.5px;line-height:1.3;padding:2px 5px;border-radius:4px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-trip-more{font-size:9.5px;color:var(--text-faint);margin-top:2px;font-family:var(--mono);}
.cal-empty-add{opacity:0;transition:opacity .15s;position:absolute;top:4px;right:4px;font-size:12px;color:var(--text-faint);}
.cal-cell.empty-day:hover{border-color:var(--border);cursor:pointer;}
.cal-cell.empty-day:hover .cal-empty-add{opacity:1;}

/* ---------- trip sidebar list ---------- */
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.side-head h3{font-family:var(--serif);font-size:16px;margin:0;font-weight:600;}
.btn-add-trip{width:100%;background:rgba(212,162,76,0.07);border-color:rgba(212,162,76,0.22);color:var(--gold);margin-bottom:16px;}
.btn-add-trip:hover{background:rgba(212,162,76,0.16);}
.trip-list{display:flex;flex-direction:column;gap:10px;}
.trip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:border-color .15s;position:relative;}
.trip-card:hover{border-color:var(--border-strong);}
.trip-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.trip-card-headline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;}
.trip-card-name{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text);}
.trip-card-range{font-size:16px;color:var(--text);font-weight:600;font-family:var(--mono);white-space:nowrap;}
.trip-card-actions{display:flex;gap:6px;flex-shrink:0;}
.trip-card-del,.trip-card-edit{opacity:0;transition:opacity .15s;}
.trip-card:hover .trip-card-del,.trip-card:hover .trip-card-edit{opacity:1;}
.trip-card-edit{width:auto;padding:7px 14px;gap:5px;font-size:12.5px;}
.trip-card-stats{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--text-faint);}
.trip-card-stats span{display:flex;align-items:center;gap:4px;}
.trip-card-people{margin-top:6px;font-size:11px;color:var(--text-faint);}
.trip-empty{text-align:center;color:var(--text-faint);font-size:13px;padding:30px 10px;border:1px dashed var(--border);border-radius:var(--radius);}

/* ---------- home todo island ---------- */
.home-todo-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.home-todo-form input[type=text]{flex:1;min-width:130px;padding:9px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:13px;}
.home-todo-date-wrap{width:126px;}
.home-todo-date-wrap input[type=date]{width:100%;padding:9px 30px 9px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:12px;font-family:inherit;color-scheme:dark;}
.home-todo-select{padding:9px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:12.5px;}
.home-todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);margin-bottom:8px;flex-wrap:wrap;transition:background .15s,border-color .15s;}
.home-todo-item.due-soon{background:#8a6a1a;border-color:#E4B73E;}
.home-todo-text{flex:1;font-size:13.5px;min-width:100px;}
.home-todo-item.checked .home-todo-text{color:var(--text-faint);text-decoration:line-through;}
.home-todo-item.due-soon .home-todo-text{color:#fff;}
.home-todo-meta{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.home-todo-due-label{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);white-space:nowrap;}
.home-todo-item.due-soon .home-todo-due-label{color:#fff;}
.home-todo-due-display{font-size:12.5px;color:var(--text-dim);font-family:var(--mono);cursor:pointer;padding:4px 7px;border-radius:6px;white-space:nowrap;}
.home-todo-due-display:hover{background:var(--surface-3);color:var(--gold);}
.home-todo-item.due-soon .home-todo-due-display{color:#fff;font-weight:700;}
.home-todo-item.due-soon .home-todo-due-display:hover{background:rgba(0,0,0,0.25);color:#fff;}
.home-todo-due-wrap{position:relative;width:118px;}
.home-todo-due-wrap input[type=date]{width:100%;padding:6px 26px 6px 8px;border-radius:7px;border:1px solid var(--gold);background:var(--surface-2);color:var(--text);font-size:12.5px;font-family:var(--mono);color-scheme:dark;cursor:pointer;}
.home-todo-item.due-soon .home-todo-due-wrap input[type=date]{background:rgba(0,0,0,0.3);color:#fff;border-color:#fff;}
.home-todo-due-wrap .date-cal-icon{right:7px;font-size:12px;}
.home-todo-assignee-display{font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--surface-3);color:var(--text);white-space:nowrap;cursor:pointer;}
.home-todo-assignee-display:hover{background:var(--gold-dim);color:var(--gold);}
.home-todo-item.due-soon .home-todo-assignee-display{background:rgba(0,0,0,0.35);color:#fff;}
.home-todo-item.due-soon .home-todo-assignee-display:hover{background:rgba(0,0,0,0.5);color:#fff;}
.home-todo-assignee-select{font-size:13px;font-weight:600;padding:5px 8px;border-radius:6px;background:var(--surface-3);color:var(--text);border:1px solid var(--gold);white-space:nowrap;cursor:pointer;}
.home-todo-item.due-soon .home-todo-assignee-select{background:rgba(0,0,0,0.35);color:#fff;border-color:#fff;}

/* ---------- trip card inline tabs ---------- */
.trip-card-tabs{display:flex;gap:4px;margin-top:12px;background:var(--surface-3);border-radius:10px;padding:4px;overflow-x:auto;scrollbar-width:none;}
.trip-card-tabs::-webkit-scrollbar{display:none;}
.trip-card-tab{padding:7px 12px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border:none;background:transparent;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.trip-card-tab:hover{color:var(--text);}
.trip-card-tab.active{background:var(--gold);color:#1a1508;}
.trip-card-panel{margin-top:14px;padding:16px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--border);}

/* ---------- overview tab ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
@media(max-width:760px){.stat-row{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){
  #app{padding:0 8px 80px;}
  .trip-card{padding:12px 10px;}
  .trip-card-panel{padding:12px 8px;}
  .topbar-inner{padding:14px 10px;}
}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stat-label{font-size:11px;color:var(--text-faint);font-family:var(--mono);letter-spacing:0.5px;margin-bottom:6px;}
.stat-val{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--text);}
.stat-val.gold{color:var(--gold);}

.day-block{margin-bottom:18px;}
.day-block-head{display:flex;align-items:baseline;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.day-block-title{font-family:var(--serif);font-size:15.5px;font-weight:600;}
.day-block-sub{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);margin-left:8px;}
.item-row{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;}
.item-time{font-family:var(--mono);font-size:12.5px;color:var(--gold);min-width:44px;padding-top:1px;}
.item-body{flex:1;}
.item-title{font-size:13.5px;color:var(--text);font-weight:600;}
.item-note{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.5;}
.item-actions{display:flex;gap:6px;}
.item-edit-btn{display:none;}
.item-row.editing .item-edit-btn{display:inline-flex;}
.item-row[draggable="true"]{cursor:grab;}
.item-row[draggable="true"]:active{cursor:grabbing;}
.item-row.drag-over-top{box-shadow:inset 0 2px 0 var(--gold);}
.item-row.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--gold);}
.item-drag-handle{flex-shrink:0;width:20px;text-align:center;color:var(--text-faint);font-size:14px;padding-top:2px;user-select:none;}
.btn-spinner-sm{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid rgba(0,0,0,0.25);border-top-color:#1a1508;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px;}
.day-block-actions{display:flex;gap:6px;}
.empty-note{color:var(--text-faint);font-size:12.5px;padding:10px 12px;}
.day-add-btn{font-size:11.5px;color:var(--text-dim);}
.day-add-btn:hover{color:var(--gold);}
.day-add-btn.active{color:#1a1508;background:var(--gold);border-radius:6px;padding:4px 8px;}
.day-flight-block{margin-bottom:12px;}
#itemStarBtn.starred{background:var(--gold);color:#1a1508;border-color:var(--gold);}
.item-row.starred{background:rgba(228,183,62,0.16);border-color:rgba(228,183,62,0.4);}
.item-row.starred .item-title{color:#fff;}
.day-todo-block{margin-bottom:14px;padding:12px;background:var(--surface-2);border-radius:8px;}
.day-todo-block-title{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:8px;}
.todo-owner-tag{font-size:10px;color:var(--text-faint);font-family:var(--mono);padding:2px 7px;background:var(--surface-3);border-radius:5px;white-space:nowrap;}

/* ---------- flights tab ---------- */
.flight-section{margin-bottom:22px;}
.flight-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.flight-section-title{font-family:var(--serif);font-size:15.5px;font-weight:600;}
.flight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.flight-card:hover{border-color:var(--border-strong);}
.flight-card-date{font-size:11px;color:var(--text-faint);margin-bottom:12px;}
.flight-route-main{display:flex;align-items:center;gap:12px;}
.flight-endpoint{flex:1;min-width:0;}
.flight-endpoint-time{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text);line-height:1.1;}
.flight-endpoint-place{font-size:12px;color:var(--text-dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.flight-endpoint.is-arrival{text-align:right;}
.flight-duration-mid{display:flex;flex-direction:column;align-items:center;color:var(--text-faint);font-size:10.5px;min-width:80px;flex-shrink:0;gap:4px;}
.flight-duration-line{width:100%;height:1px;background:var(--border-strong);position:relative;}
.flight-duration-line::after{content:'✈';position:absolute;right:-2px;top:-8px;font-size:11px;color:var(--gold);}
.flight-secondary-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-faint);flex-wrap:wrap;gap:8px;}
.flight-seat-tag{font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold-dim);padding:3px 8px;border-radius:6px;flex-shrink:0;}
.flight-layover{display:flex;align-items:center;gap:8px;padding:8px 4px;margin:2px 0 10px 0;font-size:11.5px;color:var(--text-faint);border-left:2px dashed var(--border-strong);padding-left:14px;}
.flight-empty{color:var(--text-faint);font-size:12.5px;padding:10px 4px;}
.airport-row{display:flex;gap:8px;}
.airport-row input{flex:1;}
.flight-duration-row{display:flex;justify-content:center;margin:2px 0 14px;}
.flight-duration-btn{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}
.flight-duration-btn:hover{background:rgba(212,162,76,0.28);}
.wheel-time-display{padding:10px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:15px;font-family:var(--mono);text-align:center;cursor:pointer;letter-spacing:1px;}
.wheel-time-display:hover{border-color:var(--gold);color:var(--gold);}
.wheel-picker{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:180px;margin:10px 0 6px;}
.wheel-highlight-bar{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:36px;background:var(--gold-dim);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);pointer-events:none;z-index:0;border-radius:6px;}
.wheel-col{position:relative;z-index:1;width:64px;height:180px;overflow-y:auto;scroll-snap-type:y mandatory;text-align:center;scrollbar-width:none;}
.wheel-col::-webkit-scrollbar{display:none;}
.wheel-spacer{height:72px;}
.wheel-item{height:36px;line-height:36px;scroll-snap-align:center;font-size:18px;color:var(--text-faint);font-family:var(--mono);cursor:pointer;user-select:none;}
.wheel-item.center{color:var(--gold);font-weight:700;font-size:21px;}
.wheel-colon{font-size:20px;font-weight:700;color:var(--text-dim);z-index:1;}
.flight-seat-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.flight-seat-row input{flex:2 1 0;min-width:0;}
.flight-seat-row select{flex:1 1 0;min-width:0;max-width:88px;font-size:12px;padding:8px 6px;}
.flight-seat-row [data-seat-remove]{flex-shrink:0;}
.airline-row{display:flex;gap:8px;}
.airline-row select{flex:1;}
.airline-row button{flex-shrink:0;}
.airline-add-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.airline-add-row input{flex:1 1 100px;min-width:0;}
.airline-add-row button{flex-shrink:0;}
.airline-manage-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
.airline-manage-row:last-child{border-bottom:none;}
.airline-manage-name{flex:1;font-size:13.5px;}
.pack-cat-rename-input{flex:1;}
.cat-manage-split{display:flex;gap:14px;}
.cat-manage-col{flex:1;min-width:0;}
.cat-manage-col-title{font-size:11px;color:var(--text-faint);font-family:var(--mono);letter-spacing:0.5px;margin-bottom:8px;}
.pack-cat-row{display:flex;align-items:center;gap:0;padding:0;border-radius:8px;cursor:pointer;border:2px solid transparent;margin-bottom:6px;overflow:hidden;}
.pack-cat-row:hover{border-color:rgba(255,255,255,0.25);}
.pack-cat-row.active{border-color:#fff;}
.pack-cat-row .pack-cat-rename-input{font-size:12.5px;font-weight:700;padding:9px 10px;border:none;border-radius:0;color:#1a1508;flex:0 0 55%;min-width:0;background:transparent;}
.pack-cat-row .pack-cat-rename-input:hover,.pack-cat-row .pack-cat-rename-input:focus{background:rgba(0,0,0,0.08);}
.pack-cat-row:not(.active) .pack-cat-rename-input{pointer-events:none;}
.pack-cat-row-fill{flex:1;min-width:0;align-self:stretch;}
.pack-cat-row [data-cat-del]{flex-shrink:0;margin-right:6px;opacity:0;transition:opacity .15s;}
.pack-cat-row.active [data-cat-del]{opacity:1;}
.pack-cat-row.excluded{background:#1c1c1c !important;}
.pack-cat-row.excluded .pack-cat-rename-input{color:#8a8a8a !important;text-decoration:line-through;}
.pack-cat-exclude-check{width:22px;height:22px;border-radius:5px;border:2px solid rgba(0,0,0,0.35);flex-shrink:0;margin-right:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#1a1508;cursor:pointer;background:rgba(255,255,255,0.18);}
.pack-cat-exclude-check.checked{background:#1a1a1a;border-color:#000;color:#fff;}
.pack-sub-row.excluded{background:#1c1c1c;border-radius:6px;}
.pack-sub-row.excluded .pack-sub-rename-input{color:#8a8a8a;text-decoration:line-through;}
.packCatManageDoneBtn:disabled{opacity:0.35;cursor:not-allowed;}
.pack-sub-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:6px;}
.pack-sub-row:hover{background:var(--surface-3);}
.pack-sub-rename-input{background:transparent;border:1px solid transparent;}
.pack-sub-rename-input:hover,.pack-sub-rename-input:focus{background:var(--surface-2);border-color:var(--border-strong);}
.pack-sub-row [data-sub-del]{opacity:0;transition:opacity .15s;}
.pack-sub-row:hover [data-sub-del]{opacity:1;}
.pack-manage-row{display:flex;align-items:center;gap:6px;padding:7px 2px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.pack-manage-row:last-child{border-bottom:none;}
.pack-manage-row select,.pack-manage-add-row select{font-size:12px;padding:7px 4px;min-width:0;}
.pack-manage-cat{flex:1 1 42%;}
.pack-manage-sub{flex:1 1 42%;}
.pack-manage-qty{width:52px;flex-shrink:0;}
.pack-manage-person{flex:1 1 42%;}
.pack-manage-add-row{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;}
.pack-manage-add-row select{flex:1 1 30%;}
.pack-manage-add-row #packManageAddQty{width:52px;flex:0 0 52px;}
.pack-manage-add-row button{flex-shrink:0;}
.pack-staged-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12.5px;}
.pack-staged-row:last-child{border-bottom:none;}
.pack-staged-row-text{flex:1;min-width:0;}
.pack-staged-row-text .pack-staged-person{display:block;font-size:10.5px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}
.pack-sub-rename-input{flex:1;font-size:12.5px;padding:6px 8px;min-width:0;}
.pack-sub-qty-select{width:58px;font-size:12px;padding:6px 4px;flex-shrink:0;min-width:0;}
.flight-seat-tags{display:flex;flex-wrap:wrap;gap:6px;}

/* ---------- packing tab ---------- */
.pack-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.pack-bar{flex:1;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.pack-bar-fill{height:100%;background:var(--sage);border-radius:99px;transition:width .2s;}
.pack-progress-label{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
.pack-people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
@media(max-width:520px){.pack-people-grid{grid-template-columns:1fr;}}
.pack-people-stack{display:flex;flex-direction:column;gap:12px;}
.pack-person-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-width:0;overflow:hidden;}
.pack-person-col.collapsed{padding:10px 14px;}
.pack-person-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border-strong);}
.pack-person-col.collapsed .pack-person-head{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.pack-person-head.clickable{cursor:pointer;}
.pack-collapse-arrow{font-size:11px;color:var(--text-faint);width:12px;flex-shrink:0;}
.pack-person-head-fill{flex:1 1 auto;}
.pack-person-add{width:auto;padding:6px 12px;font-size:12px;line-height:1;background:rgba(212,162,76,0.16);border-color:rgba(212,162,76,0.4);color:var(--gold);font-weight:600;}
.pack-person-add:hover{background:rgba(212,162,76,0.26);}
.pack-person-edit{width:auto;padding:6px 12px;gap:4px;font-size:12px;}
.pack-person-name{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--text);}
.pack-person-count{font-size:11px;color:var(--text-faint);font-family:var(--mono);}
.pack-cat-group-title{font-size:11px;color:var(--text-faint);font-family:var(--mono);letter-spacing:0.5px;margin:12px 0 6px 0;}
.pack-cat-group-title:first-child{margin-top:0;}
.pack-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);}
.pack-item:last-child{border-bottom:none;}
.pack-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#1a1508;}
.pack-check.checked{background:var(--sage);border-color:var(--sage);}
.pack-item-text{flex:1;font-size:13.5px;}
.pack-item.checked{background:var(--surface-3);border-radius:6px;}
.pack-item.checked .pack-item-text{color:var(--text-faint);text-decoration:line-through;}
.pack-item-cat{font-size:10px;color:var(--text-faint);margin-left:6px;font-family:var(--mono);}
.pack-add-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.pack-staged-section{margin-top:16px;padding:12px 12px 4px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);}
.pack-staged-section .cat-manage-col-title{margin-bottom:10px;}
.pack-dup-row{padding:12px 0;border-bottom:1px solid var(--border);}
.pack-dup-row:last-child{border-bottom:none;}
.pack-dup-text{font-size:13.5px;color:var(--text);line-height:1.5;margin-bottom:8px;}
.pack-dup-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);cursor:pointer;}
.pack-add-row input{flex:1 1 100px;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:12.5px;}
.pack-add-row select{flex:0 1 92px;min-width:70px;padding:8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:11.5px;}

/* ---------- ledger tab ---------- */
.ledger-total-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.ledger-total-label{font-size:12px;color:var(--text-faint);font-family:var(--mono);}
.ledger-total-val{font-size:26px;font-weight:700;color:var(--gold);font-family:var(--mono);}
.ledger-day{margin-bottom:14px;}
.ledger-day-head{font-size:12px;color:var(--text-faint);font-family:var(--mono);padding:6px 2px;}
.tx-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:7px;cursor:pointer;}
.tx-row:hover{border-color:var(--border-strong);}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;}
.tx-note{flex:1;font-size:13px;color:var(--text);}
.tx-payer{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);white-space:nowrap;}
.tx-amt{font-family:var(--mono);font-size:14px;font-weight:600;}
.tx-amt-refund{color:var(--sage);}
.tx-actions{display:flex;gap:4px;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:12.5px;cursor:pointer;transition:all .15s;}
.chip:hover{border-color:var(--border-strong);color:var(--text);}
.chip.active{color:#fff;font-weight:600;border-color:transparent;}

/* ---------- todo tab ---------- */
.todo-add-row{display:flex;gap:8px;margin-bottom:14px;}
.todo-add-row input{flex:1;}
.suggest-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.suggest-chip{padding:5px 11px;border-radius:99px;border:1px dashed var(--border-strong);background:transparent;color:var(--text-faint);font-size:11.5px;cursor:pointer;}
.suggest-chip:hover{color:var(--gold);border-color:var(--gold);}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 10px;margin-bottom:8px;border-radius:8px;background:var(--surface);flex-wrap:wrap;transition:background .15s;}
.todo-item:last-child{margin-bottom:0;}
.todo-item.due-soon{background:rgba(228,183,62,0.14);border:1px solid rgba(228,183,62,0.32);border-radius:8px;padding:9px 8px;border-bottom-color:transparent;}
.todo-check{width:19px;height:19px;border-radius:99px;border:1.5px solid var(--border-strong);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#1a1508;}
.todo-check.checked{background:var(--gold);border-color:var(--gold);}
.todo-text{flex:1;font-size:13.5px;min-width:80px;}
.todo-item.checked .todo-text{color:var(--text-faint);text-decoration:line-through;}
.todo-item.due-soon .todo-text{color:#fff;}
.todo-due-display{font-size:13.5px;font-weight:600;color:var(--text-dim);font-family:var(--mono);padding:3px 7px;border-radius:6px;white-space:nowrap;}
.todo-due-display:hover{background:var(--surface-3);color:var(--gold);}
.todo-due-display.todo-due-empty{color:var(--text-faint);font-style:italic;}
.todo-item.due-soon .todo-due-display{color:#fff;font-weight:700;}
.todo-item.due-soon .todo-due-display:hover{background:rgba(0,0,0,0.25);color:#fff;}
.todo-due-edit-wrap{position:relative;width:118px;}
.todo-due-edit-wrap input[type=date]{width:100%;padding:6px 26px 6px 8px;border-radius:7px;border:1px solid var(--gold);background:var(--surface-2);color:var(--text);font-size:12.5px;font-family:var(--mono);color-scheme:dark;cursor:pointer;}
.todo-due-edit-wrap .date-cal-icon{right:7px;font-size:12px;}
.todo-add-date-wrap{flex:1 1 110px;min-width:90px;}
.todo-add-date-wrap input[type=date]{width:100%;padding:8px 26px 8px 8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:12px;color-scheme:dark;}
.todo-add-date-wrap .date-cal-icon{right:8px;font-size:12px;}

/* ---------- forms ---------- */
.field-row{display:flex;gap:12px;flex-wrap:wrap;}
.pack-add-item-row2{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px;}
.pack-add-item-row2 .field{flex:1 1 100px;min-width:80px;margin-bottom:0;}
.pack-add-item-row2 button{flex-shrink:0;}
.field{flex:1;min-width:120px;margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--text-faint);font-family:var(--mono);letter-spacing:0.5px;margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=time],.field textarea,.field select{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:13.5px;
}
.field textarea{resize:vertical;min-height:56px;}
.date-input-wrap{position:relative;}
.date-input-wrap input[type=date]{
  width:100%;padding:10px 34px 10px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:13.5px;
  font-family:inherit;color-scheme:dark;
}
.date-input-wrap input[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;top:0;width:100%;height:100%;cursor:pointer;}
.date-cal-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--gold);pointer-events:none;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,12,16,0.6);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:24px;width:100%;max-width:440px;max-height:82vh;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.modal-title{display:flex;align-items:center;justify-content:space-between;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.modal-actions-split{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.cat-manage-actions{margin-bottom:12px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:11px 20px;border-radius:99px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:all .25s ease;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.footer-note{text-align:center;color:var(--text-faint);font-size:11px;margin-top:40px;font-family:var(--mono);}

.loading-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.loading-screen .brand-mark{font-size:28px;}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--gold);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.gate-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; background:var(--bg);
}
.gate-card{
  width:100%; max-width:340px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:28px 24px; text-align:center;
}
.gate-sub{ font-size:13px; color:var(--text-dim); margin:10px 0 22px 0; line-height:1.5; }
.gate-btn{
  width:100%; padding:13px; border-radius:10px; border:none;
  background:var(--gold); color:#1a1508; font-weight:700; font-size:15px; cursor:pointer;
}
.gate-btn:active{ opacity:0.85; }
.gate-status{ margin-top:14px; font-size:12.5px; color:var(--text-dim); }
.gate-error{ margin-top:14px; font-size:12.5px; color:#d9552a; }
</style>
</head>
<body>

<div id="signinScreen" class="gate-screen">
  <div class="gate-card">
    <div class="brand-mark" style="font-size:26px;">好旅伴</div>
    <div class="gate-sub">用 Google 帳號登入，資料會存到共用的雲端硬碟</div>
    <button type="button" id="googleSigninBtn" class="gate-btn">使用 Google 登入</button>
    <div id="signinLoading" class="gate-status" style="display:none;">連接雲端硬碟中…</div>
    <div id="signinError" class="gate-error" style="display:none;"></div>
  </div>
</div>

<div class="loading-screen" id="loadingScreen" style="display:none;">
  <div class="brand-mark">好旅伴</div>
  <div class="spinner"></div>
</div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brandHome">
      <span class="brand-mark">好旅伴</span>
      <span class="brand-sub">Companion</span>
    </div>
    <div class="topbar-right">
      <div class="backup-actions">
        <button class="btn btn-sm" id="btnExportBackup">↓ 備份匯出</button>
        <button class="btn btn-sm" id="btnImportBackup">↑ 備份匯入</button>
        <input type="file" id="importBackupInput" accept="application/json" style="display:none;">
      </div>
    </div>
  </div>
</div>

<div id="app">

  <!-- ===================== HOME VIEW ===================== -->
  <div class="view active" id="viewHome">
    <div class="home-stack">
      <div>
        <div class="side-head"><h3>旅遊計畫</h3></div>
        <button class="btn btn-add-trip" id="btnAddTrip">✈ 新增旅遊計畫</button>
        <div class="trip-list" id="tripList"></div>
      </div>
    </div>
    <div class="footer-note">資料儲存在你的 Claude 帳號雲端 · 手機與電腦登入同一帳號即可同步</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- ===================== trip create/edit modal ===================== -->
<div class="modal-overlay" id="tripModalOverlay">
  <div class="modal">
    <div class="modal-title"><span id="tripModalTitle">新增旅遊計畫</span><button class="btn-icon" id="tripModalClose">✕</button></div>
    <div class="field">
      <label>計畫名稱</label>
      <input type="text" id="tripNameInput" placeholder="例如：埃及">
    </div>
    <div class="field-row">
      <div class="field">
        <label>出發日</label>
        <div class="date-input-wrap"><input type="date" id="tripStartInput"><span class="date-cal-icon">📅</span></div>
      </div>
      <div class="field">
        <label>返回日</label>
        <div class="date-input-wrap"><input type="date" id="tripEndInput"><span class="date-cal-icon">📅</span></div>
      </div>
    </div>
    <div class="field">
      <label>參與者</label>
      <div class="chip-row" id="tripParticipantsRow"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="text" id="tripNewParticipantInput" placeholder="輸入姓名後按+新增參與者">
        <button class="btn btn-sm" id="tripAddParticipantBtn" type="button">+</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="tripModalCancel">取消</button>
      <button class="btn btn-primary" id="tripModalSave">儲存</button>
    </div>
  </div>
</div>

<!-- ===================== itinerary item modal ===================== -->
<div class="modal-overlay" id="itemModalOverlay">
  <div class="modal">
    <div class="modal-title">
      <span id="itemModalTitle">新增行程</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn-icon" id="itemStarBtn" type="button" title="標記重要">☆</button>
        <button class="btn-icon" id="itemModalClose">✕</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field" style="max-width:120px;">
        <label>時間</label>
        <input type="time" id="itemTimeInput">
      </div>
      <div class="field">
        <label>項目</label>
        <input type="text" id="itemTitleInput" placeholder="例如：吉薩金字塔">
      </div>
    </div>
    <div class="field">
      <label>備註</label>
      <textarea id="itemNoteInput" placeholder="地點、交通方式、注意事項…"></textarea>
    </div>
    <div class="modal-actions-split">
      <button class="btn btn-danger" id="itemModalDelete" style="display:none;">刪除</button>
      <div class="modal-actions" style="margin:0;">
        <button class="btn" id="itemModalCancel">取消</button>
        <button class="btn btn-primary" id="itemModalSave">儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== expense modal ===================== -->
<div class="modal-overlay" id="expenseModalOverlay">
  <div class="modal">
    <div class="modal-title"><span id="expenseModalTitle">新增消費</span><button class="btn-icon" id="expenseModalClose">✕</button></div>
    <div class="field">
      <label>分類</label>
      <div class="chip-row" id="expenseCatRow"></div>
    </div>
    <div class="field">
      <label>類型</label>
      <div class="chip-row" id="expenseTypeRow"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>日期</label>
        <div class="date-input-wrap"><input type="date" id="expenseDateInput"><span class="date-cal-icon">📅</span></div>
      </div>
      <div class="field">
        <label>金額 (NT$)</label>
        <input type="number" id="expenseAmountInput" placeholder="0" inputmode="numeric">
      </div>
    </div>
    <div class="field">
      <label>備註</label>
      <input type="text" id="expenseNoteInput" placeholder="例如：機場快線車票">
    </div>
    <div class="field">
      <label>花費人</label>
      <select id="expensePayerInput"></select>
    </div>
    <div class="modal-actions-split">
      <button class="btn btn-danger" id="expenseModalDelete" style="display:none;">刪除</button>
      <div class="modal-actions" style="margin:0;">
        <button class="btn" id="expenseModalCancel">取消</button>
        <button class="btn btn-primary" id="expenseModalSave">儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== flight modal ===================== -->
<div class="modal-overlay" id="flightModalOverlay">
  <div class="modal" style="max-width:480px;">
    <div class="modal-title"><span id="flightModalTitle">新增航班</span><button class="btn-icon" id="flightModalClose">✕</button></div>
    <div class="field">
      <label>出發地點</label>
      <div class="airport-row">
        <input type="text" id="flightDepAirportInput" placeholder="例如：TPE">
        <input type="text" id="flightDepTerminalInput" placeholder="航廈（選填）">
      </div>
    </div>
    <div class="field">
      <label>抵達地點</label>
      <div class="airport-row">
        <input type="text" id="flightArrAirportInput" placeholder="例如：DXB">

/* ---------------- state ---------------- */
const today = new Date();

/* ---------------- utils ---------------- */
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function isoOf(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); }
function todayIso(){ return isoOf(today.getFullYear(), today.getMonth(), today.getDate()); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Math.round(n||0).toLocaleString('en-US'); }
function peopleList(){ return state.people.length ? state.people : DEFAULT_PEOPLE; }
function airlineList(){ return state.airlines; }
async function ensureAirline(name){

  if(!state.airlines.includes(name)){
    state.airlines.push(name);

}

  if(selected && !list.includes(selected)){
    html = '<option value="'+escapeHtml(selected)+'" selected>'+escapeHtml(selected)+'</option>' + html;
  }
  return html;
}

function shortDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return m+'/'+d; }
function weekdayLabel(iso){ const d=new Date(iso+'T00:00:00'); const idx=(d.getDay()+6)%7; return DOW[idx]; }
function rangeLabel(t){
  if(!t.startDate && !t.endDate) return '尚未設定日期';
  if(t.startDate && t.endDate) return shortDate(t.startDate)+' - '+shortDate(t.endDate);
  return shortDate(t.startDate||t.endDate)+' 起';
}
function daysBetween(startIso, endIso){
  const out=[]; if(!startIso || !endIso) return out;
  let cur = new Date(startIso+'T00:00:00');
  const end = new Date(endIso+'T00:00:00');
  let guard=0;
  while(cur<=end && guard<400){
    out.push(isoOf(cur.getFullYear(), cur.getMonth(), cur.getDate()));
    cur.setDate(cur.getDate()+1);
    guard++;
  }
  return out;
}
function daysUntil(iso){
  const d = new Date(iso+'T00:00:00');
  const t = new Date(todayIso()+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function isDueSoon(item){
  return !item.checked && item.dueDate && daysUntil(item.dueDate)<=3;
}
function getTrip(id){ return state.trips.find(t=>t.id===id); }

function bindOverlayDismiss(id, closeFn){
  const overlay = document.getElementById(id);
  let downOnOverlay = false;
  overlay.addEventListener('mousedown', (e)=>{ downOnOverlay = (e.target.id===id); });
  overlay.addEventListener('mouseup', (e)=>{
    if(downOnOverlay && e.target.id===id) closeFn();
    downOnOverlay = false;
  });
  overlay.addEventListener('touchstart', (e)=>{ downOnOverlay = (e.target.id===id); }, {passive:true});
  overlay.addEventListener('touchend', (e)=>{
    if(downOnOverlay && e.target.id===id) closeFn();
    downOnOverlay = false;
  });
}

/* ================= PER-TRIP OVERVIEW CALENDAR ================= */
let overviewCalState = {}; // tripId -> {year, month}
function getOverviewCalState(t){
  if(!overviewCalState[t.id]){
    let y = today.getFullYear(), m = today.getMonth();
    if(t.startDate){
      const d = new Date(t.startDate+'T00:00:00');
      y = d.getFullYear(); m = d.getMonth();
    }
    overviewCalState[t.id] = {year:y, month:m};
  }
  return overviewCalState[t.id];
}
function shiftOverviewCalMonth(tripId, delta){
  const cs = overviewCalState[tripId];
  let m = cs.month + delta, y = cs.year;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  cs.month = m; cs.year = y;
}
let overviewSelectedDay = {}; // tripId -> selected ISO date or undefined
function tripOverviewCalendarHtml(t){
  const cs = getOverviewCalState(t);
  const y = cs.year, m = cs.month;
  const selectedIso = overviewSelectedDay[t.id];
  const todosByDate = {};
  (t.todos||[]).forEach(td=>{ if(td.dueDate) todosByDate[td.dueDate] = (todosByDate[td.dueDate]||0) + 1; });
  let html = '<div class="ov-cal-card" data-ov-cal="'+t.id+'">' +
    '<div class="cal-head"><div class="cal-title">'+y+'年'+(m+1)+'月</div>' +
    '<div class="cal-nav">' +
      '<button class="btn-icon" data-cal-prev="'+t.id+'">‹</button>' +
      '<button class="btn btn-sm cal-today-btn" data-cal-today="'+t.id+'">今天</button>' +
      '<button class="btn-icon" data-cal-next="'+t.id+'">›</button>' +
    '</div></div>' +
    '<div class="cal-grid">';
  html += DOW.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  const firstDow = (new Date(y,m,1).getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  for(let i=0;i<firstDow;i++) html += '<div class="cal-cell empty"></div>';
  const tIso = todayIso();
  for(let d=1; d<=daysInMonth; d++){
    const iso = isoOf(y,m,d);
    const inRange = t.startDate && t.endDate && iso>=t.startDate && iso<=t.endDate;
    const hasTodo = !!todosByDate[iso];
    const isClickable = inRange || hasTodo;
    const isToday = iso===tIso;
    let cls = 'cal-cell';
    if(isToday) cls += ' is-today';
    if(inRange) cls += ' has-trip';
    if(isClickable && iso===selectedIso) cls += ' is-selected';
    let inner = '<div class="cal-daynum">'+d+'</div>';
    if(inRange) inner += '<div class="cal-trip-label" style="background:'+t.color+';">'+escapeHtml(t.name)+'</div>';
    if(hasTodo) inner += '<div class="cal-todo-dot" title="'+todosByDate[iso]+' 筆待辦"></div>';
    html += '<div class="'+cls+'"'+(isClickable?' data-cal-day="'+iso+'"':'')+'>'+inner+'</div>';
  }
  html += '</div></div>';
  return html;
}
function bindOverviewCalendarEvents(t, el){
  el.querySelectorAll('[data-cal-prev]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ shiftOverviewCalMonth(t.id, -1); renderTripList(); });
  });
  el.querySelectorAll('[data-cal-next]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ shiftOverviewCalMonth(t.id, 1); renderTripList(); });
  });
  el.querySelectorAll('[data-cal-today]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ overviewCalState[t.id] = {year:today.getFullYear(), month:today.getMonth()}; renderTripList(); });
  });
  el.querySelectorAll('[data-cal-day]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const iso = cell.dataset.calDay;
      overviewSelectedDay[t.id] = (overviewSelectedDay[t.id]===iso) ? undefined : iso;
      renderTripList();
    });
  });
}
function isShortTrip(t){
  if(!t.startDate || !t.endDate) return false;
  const days = daysBetween(t.startDate, t.endDate).length;
  return days>0 && days<31;
}

function tripStats(t){
  const packedTotal = (t.packing||[]).reduce((s,c)=>s+c.items.length,0);
  const packedDone = (t.packing||[]).reduce((s,c)=>s+c.items.filter(i=>i.checked).length,0);
  const todoTotal = (t.todos||[]).length;
  const todoDone = (t.todos||[]).filter(x=>x.checked).length;
  const ledgerTotal = (t.ledger||[]).reduce((s,e)=>s+effectiveAmount(e),0);

/* ---------- overview tab ---------- */
function flightsForDay(t, iso){
  const out = ((t.flights && t.flights.outbound) || []).filter(s=>s.depDate===iso);
  const ret = ((t.flights && t.flights.return) || []).filter(s=>s.depDate===iso);
  const dom = ((t.flights && t.flights.domestic) || []).filter(s=>s.depDate===iso);
  return {out, ret, dom};
}
function dayFlightBlockHtml(t, iso){
  const {out, ret, dom} = flightsForDay(t, iso);
  const all = [...out, ...ret, ...dom].sort((a,b)=> (a.depTime||'').localeCompare(b.depTime||''));
  if(!all.length) return '';
  let html = '<div class="day-flight-block">';
  all.forEach(seg=>{
    html += flightSegHtml(seg);
  });
  html += '</div>';
  return html;
}
function dayTodoBlockHtml(t, iso){
  const items = (t.todos||[]).filter(x=>x.dueDate===iso);
  if(!items.length) return '';
  let html = '<div class="day-todo-block"><div class="day-todo-block-title">待辦事項</div>';
  items.forEach(item=>{
    html += '<div class="todo-item'+(item.checked?' checked':'')+'" data-item="'+item.id+'">' +
      '<div class="todo-check'+(item.checked?' checked':'')+'" data-toggle-todo="'+item.id+'">'+(item.checked?'✓':'')+'</div>' +
      '<div class="todo-text">'+escapeHtml(item.text)+'</div>' +
      (item.owner ? '<span class="todo-owner-tag">'+escapeHtml(item.owner)+'</span>' : '') +
      '<button class="btn-icon btn-sm" data-edit-todo="'+item.id+'">✎</button>' +
    '</div>';
  });
  html += '</div>';
  return html;
}
let itineraryEditDays = new Set(); // 'tripId|iso' keys currently in edit mode
let draggedItemId = null;
function dayEditKey(tripId, iso){ return tripId+'|'+iso; }
function sortDayItems(items){
  const anyOrdered = items.some(it=>it.order!=null);
  if(!anyOrdered){
    return items.slice().sort((a,b)=>{
      if(!a.time && !b.time) return 0;
      if(!a.time) return 1;
      if(!b.time) return -1;
      return a.time.localeCompare(b.time);
    });
  }
  return items.slice().sort((a,b)=>{
    const ao = a.order!=null ? a.order : 1e9;
    const bo = b.order!=null ? b.order : 1e9;
    return ao - bo;
  });
}
function isValidTimeOrder(items){
  let lastTime = null;
  for(const it of items){
    if(it.time){
      if(lastTime && it.time < lastTime) return false;
      lastTime = it.time;
    }
  }
  return true;
}
function itemRowHtml(it, editing){
  return '<div class="item-row'+(it.starred?' starred':'')+(editing?' editing':'')+'" data-item="'+it.id+'"'+(editing?' draggable="true" data-draggable-item="'+it.id+'"':'')+'>' +
    (editing ? '<div class="item-drag-handle">⠿</div>' : '') +
    '<div class="item-time">'+(it.time||'—')+'</div>' +
    '<div class="item-body"><div class="item-title">'+(it.starred?'★ ':'')+escapeHtml(it.title)+'</div>' +
    (it.note ? '<div class="item-note">'+escapeHtml(it.note)+'</div>' : '') + '</div>' +
    '<div class="item-actions"><button class="btn-icon btn-sm item-edit-btn" data-edit-item="'+it.id+'">✎</button></div>' +
  '</div>';
}
function dayBlockHtml(t, iso, dayLabel){
  const items = sortDayItems((t.itinerary||[]).filter(it=>it.date===iso));
  const {out, ret, dom} = flightsForDay(t, iso);
  const flights = [...out, ...ret, ...dom];
  const editing = itineraryEditDays.has(dayEditKey(t.id, iso));
  let html = '<div class="day-block">' +
    '<div class="day-block-head"><div><span class="day-block-title">'+dayLabel+'</span><span class="day-block-sub">'+shortDate(iso)+'（'+weekdayLabel(iso)+'）</span></div>' +
    '<div class="day-block-actions">' +
      '<button class="btn btn-sm day-add-btn'+(editing?' active':'')+'" data-edit-day="'+t.id+'|'+iso+'">'+(editing?'完成排序':'✎ 編輯')+'</button>' +
      '<button class="btn btn-sm day-add-btn" data-add-item="'+iso+'">+ 新增行程</button>' +
    '</div></div>';
  html += dayTodoBlockHtml(t, iso);

  // merge flights and timed itinerary items into one time-sorted sequence;
  // untimed itinerary items are appended at the end (or via their own drag order)
  const timedEntries = [];
  const noTimeItems = [];
  items.forEach(it=>{
    if(it.time) timedEntries.push({time: it.time, html: itemRowHtml(it, editing)});
    else noTimeItems.push(it);
  });
  flights.forEach(seg=>{
    timedEntries.push({time: seg.depTime||'', html: flightSegHtml(seg)});
  });
  timedEntries.sort((a,b)=> (a.time||'').localeCompare(b.time||''));

  if(!timedEntries.length && !noTimeItems.length){
    html += '<div class="empty-note">這天還沒有安排行程</div>';
  } else {
    timedEntries.forEach(entry=>{ html += entry.html; });
    noTimeItems.forEach(it=>{ html += itemRowHtml(it, editing); });
  }
  html += '</div>';
  return html;
}
function overviewHtml(t){
  let html = tripOverviewCalendarHtml(t);
  const selectedIso = overviewSelectedDay[t.id];
  if(selectedIso){
    const days = daysBetween(t.startDate, t.endDate);
    const idx = days.indexOf(selectedIso);
    const label = idx>=0 ? 'Day '+(idx+1) : shortDate(selectedIso);
    html += dayBlockHtml(t, selectedIso, label);
  } else if(t.startDate && t.endDate){
    html += '<div class="empty-note">點日曆上的日期，查看當天的行程與待辦事項</div>';
  }
  return html;
}
function itineraryHtml(t){
  const days = daysBetween(t.startDate, t.endDate);
  if(!days.length){
    return '<div class="trip-empty">先設定出發日與返回日，就能規劃每天的行程囉</div>';
  }
  let html = '';
  days.forEach((iso, idx)=>{
    html += dayBlockHtml(t, iso, 'Day '+(idx+1));
  });
  return html;
}

/* ---------- flights tab ---------- */
function findFlightSegment(t, id){
  if(!t.flights) return null;
  let seg = (t.flights.outbound||[]).find(s=>s.id===id);
  if(seg) return {seg, dir:'outbound'};
  seg = (t.flights.return||[]).find(s=>s.id===id);
  if(seg) return {seg, dir:'return'};
  seg = (t.flights.domestic||[]).find(s=>s.id===id);
  if(seg) return {seg, dir:'domestic'};
  return null;
}
function minutesBetween(date1, time1, date2, time2){
  if(!date1||!time1||!date2||!time2) return null;
  const d1 = new Date(date1+'T'+time1);
  const d2 = new Date(date2+'T'+time2);
  const diff = Math.round((d2-d1)/60000);
  return diff>=0 ? diff : null;
}
function formatMinutes(min){
  if(min==null) return '';
  const h = Math.floor(min/60), m = min%60;
  return (h>0?h+'小時':'')+(m>0||h===0?m+'分鐘':'');
}
function airportLabel(code, terminal){
  if(!code) return '—';
  return terminal ? escapeHtml(code)+'/'+escapeHtml(terminal) : escapeHtml(code);
}
function flightSegHtml(seg){
  const computedMin = minutesBetween(seg.depDate, seg.depTime, seg.arrDate, seg.arrTime);
  const durMin = (seg.durationMin!=null && seg.durationMin!=='') ? seg.durationMin : computedMin;
  const secondaryBits = [
    seg.airline || '未填航空公司',
    seg.flightNo,
    seg.aircraft,
    seg.cabin,
    seg.bookingCode ? ('訂票代碼 '+seg.bookingCode) : null
  ].filter(Boolean).map(escapeHtml).join(' · ');
  const seatTags = (seg.seats||[]).filter(s=>s.seat||s.person).map(s=>
    '<span class="flight-seat-tag">'+(s.person?escapeHtml(s.person)+' ':'')+escapeHtml(s.seat||'')+'</span>'
  ).join('');
  return '<div class="flight-card" data-flight="'+seg.id+'">' +
    (seg.depDate ? '<div class="flight-card-date">'+shortDate(seg.depDate)+'（'+weekdayLabel(seg.depDate)+'）　由 '+airportLabel(seg.depAirport, seg.depTerminal)+' 至 '+airportLabel(seg.arrAirport, seg.arrTerminal)+'</div>' : '') +
    '<div class="flight-route-main">' +
      '<div class="flight-endpoint"><div class="flight-endpoint-time">'+(seg.depTime||'--:--')+'</div><div class="flight-endpoint-place">'+airportLabel(seg.depAirport, seg.depTerminal)+'</div></div>' +
      '<div class="flight-duration-mid"><span>'+(durMin!=null?formatMinutes(durMin):'')+'</span><div class="flight-duration-line"></div><span>直飛</span></div>' +
      '<div class="flight-endpoint is-arrival"><div class="flight-endpoint-time">'+(seg.arrTime||'--:--')+'</div><div class="flight-endpoint-place">'+airportLabel(seg.arrAirport, seg.arrTerminal)+'</div></div>' +
    '</div>' +
    '<div class="flight-secondary-row">' +
      '<span>'+secondaryBits+'</span>' +
      (seatTags ? '<span class="flight-seat-tags">'+seatTags+'</span>' : '') +
    '</div>' +
  '</div>';
}
function flightLayoverHtml(prevSeg, seg){
  const waitMin = minutesBetween(prevSeg.arrDate, prevSeg.arrTime, seg.depDate, seg.depTime);
  return '<div class="flight-layover">將於 '+escapeHtml(seg.depAirport||'轉機點')+' 轉機'+(waitMin!=null?'　等待 '+formatMinutes(waitMin):'')+'</div>';
}
function flightSectionHtml(title, dirKey, segments){
  const sorted = segments.slice().sort((a,b)=>{
    const ak = (a.depDate||'')+' '+(a.depTime||'');
    const bk = (b.depDate||'')+' '+(b.depTime||'');
    return ak.localeCompare(bk);
  });
  let html = '<div class="flight-section"><div class="flight-section-head"><span class="flight-section-title">'+title+'</span><button class="btn btn-sm btn-primary" data-add-flight="'+dirKey+'">+ 新增航班</button></div>';
  if(!sorted.length){
    html += '<div class="flight-empty">還沒有'+title+'的航班資料，如果有轉機可以新增第二段</div>';
  } else {
    sorted.forEach((seg,i)=>{
      if(i>0) html += flightLayoverHtml(sorted[i-1], seg);
      html += flightSegHtml(seg);
    });
  }
  html += '</div>';
  return html;
}
function flightsHtml(t){
  const f = t.flights || {outbound:[], return:[], domestic:[]};
  return flightSectionHtml('去程', 'outbound', f.outbound) + flightSectionHtml('回程', 'return', f.return) + flightSectionHtml('國內班機', 'domestic', f.domestic||[]);
}

/* ---------- packing tab ---------- */
let packPersonExpanded = {}; // key: tripId+'::'+person -> bool (default false = collapsed)
function isPackExpanded(tripId, person){
  return !!packPersonExpanded[tripId+'::'+person];
}
function togglePackExpanded(tripId, person){
  const k = tripId+'::'+person;
  packPersonExpanded[k] = !packPersonExpanded[k];
  renderTripList();
}
function groupPackItemsByCat(items){
  const order = [];
  const map = {};
  items.forEach(item=>{
    const key = item.catName || '';
    if(!(key in map)){ map[key] = []; order.push(key); }
    map[key].push(item);
  });
  return order.map(key=>({ catName:key, items:map[key] }));
}
function packPersonColHtml(t, person, items, isReadonly, scopeKey, expanded, collapsible){
  scopeKey = scopeKey || person;
  const done = items.filter(i=>i.checked).length;
  const collapsed = collapsible && !expanded;
  let html = '<div class="pack-person-col'+(collapsed?' collapsed':'')+'">';
  html += '<div class="pack-person-head'+(collapsible?' clickable':'')+'"'+(collapsible?' data-toggle-person="'+escapeHtml(scopeKey)+'"':'')+'>';
  if(collapsible){ html += '<span class="pack-collapse-arrow">'+(expanded?'▾':'▸')+'</span>'; }
  html += '<span class="pack-person-name">'+escapeHtml(person)+'</span>' +
    '<span class="pack-person-count">'+done+'/'+items.length+'</span>' +
    '<span class="pack-person-head-fill"></span>';
  if(!isReadonly){
    html += '<button class="btn-icon btn-sm pack-person-add" data-add-person-item="'+escapeHtml(scopeKey)+'" title="新增項目">新增</button>';
  }
  if(!isReadonly && (!collapsible || expanded)){
    html += '<button class="btn-icon btn-sm pack-person-edit" data-manage-person="'+escapeHtml(scopeKey)+'">✎ 編輯</button>';
  }
  html += '</div>';
  if(!collapsed){
    if(!items.length){
      html += '<div class="empty-note">還沒有項目</div>';
    } else {
      const groups = groupPackItemsByCat(items);
      groups.forEach(g=>{
        if(g.catName){ html += '<div class="pack-cat-group-title">大項目（'+escapeHtml(g.catName)+'）</div>'; }
        g.items.forEach(item=>{
          html += '<div class="pack-item'+(item.checked?' checked':'')+'" data-item="'+item.id+'">' +
            '<div class="pack-check'+(item.checked?' checked':'')+'" data-toggle-pack="'+item.id+'">'+(item.checked?'✓':'')+'</div>' +
            '<div class="pack-item-text">'+escapeHtml(item.text)+(item.qty>1?' × '+item.qty:'')+'</div>' +
            '<button class="btn-icon btn-sm" data-del-pack="'+item.id+'">✕</button>' +
          '</div>';
        });
      });
    }
  }
  html += '</div>';
  return html;
}
function packingHtml(t){
  const cats = t.packing || [];
  const owners = (t.participants && t.participants.length) ? t.participants : peopleList();
  const allItems = [];
  cats.forEach(cat=>{
    cat.items.forEach(item=>{
      allItems.push(Object.assign({}, item, {catId:cat.id, catName:cat.name}));
    });
  });
  const total = allItems.length;
  const done = allItems.filter(i=>i.checked).length;
  const pct = total ? Math.round(done/total*100) : 0;
  let html = '<div class="pack-progress"><div class="pack-bar"><div class="pack-bar-fill" style="width:'+pct+'%;"></div></div>' +
    '<div class="pack-progress-label">'+done+' / '+total+' 已打包</div></div>';

  const allExpanded = owners.length>0 && owners.every(p=>isPackExpanded(t.id, p));
  html += '<div class="'+(allExpanded ? 'pack-people-grid' : 'pack-people-stack')+'">';
  owners.forEach(person=>{
    const items = allItems.filter(i=>i.owner===person);
    html += packPersonColHtml(t, person, items, false, person, isPackExpanded(t.id, person), true);
  });
  html += '</div>';

  const shared = allItems.filter(i=>i.owner==='__all__');
  if(shared.length){
    html += packPersonColHtml(t, '全部', shared, true, '__all__', true, false);
  }
  const unassigned = allItems.filter(i=>!i.owner || (!owners.includes(i.owner) && i.owner!=='__all__'));
  if(unassigned.length){
    html += packPersonColHtml(t, '未分配', unassigned, false, '__unassigned__', true, false);
  }
  html += '<button class="btn btn-sm btn-primary" id="btnEditPackCat" style="margin-top:14px;width:100%;">編輯分類</button>';
  return html;
}

/* ---------- pack category manage ---------- */
let packCatManageCtx = null; // {tripId, selectedCatId}
let packCatExcludeMode = false;
let stagedExcludedCats = null; // Set
let stagedExcludedTemplates = null; // Set
function qtyOptionsHtml(selected){
  let html = '';
  for(let i=1;i<=10;i++){
    html += '<option value="'+i+'"'+(i===(selected||1)?' selected':'')+'>'+i+'</option>';
  }
  return html;
}
function renderPackCatExcludeArea(){
  const areas = document.querySelectorAll('.packCatExcludeArea');
  const doneBtns = document.querySelectorAll('.packCatManageDoneBtn');
  if(packCatExcludeMode){
    areas.forEach(area=>{
      area.innerHTML = '<button class="btn btn-danger packCatExcludeCancelBtn" type="button">取消</button> <button class="btn btn-primary packCatExcludeSaveBtn" type="button">儲存</button>';
    });
    doneBtns.forEach(btn=>{ btn.disabled = true; });
    document.querySelectorAll('.packCatExcludeCancelBtn').forEach(btn=>btn.addEventListener('click', cancelPackCatExcludeMode));
    document.querySelectorAll('.packCatExcludeSaveBtn').forEach(btn=>btn.addEventListener('click', savePackCatExcludeMode));
  } else {
    areas.forEach(area=>{
      area.innerHTML = '<button class="btn packCatExcludeModeBtn" type="button">不攜帶</button>';
    });
    doneBtns.forEach(btn=>{ btn.disabled = false; });
    document.querySelectorAll('.packCatExcludeModeBtn').forEach(btn=>btn.addEventListener('click', enterPackCatExcludeMode));
  }
}
function enterPackCatExcludeMode(){
  const t = getTrip(packCatManageCtx.tripId);
  stagedExcludedCats = new Set(t.packing.filter(c=>c.excluded).map(c=>c.id));
  stagedExcludedTemplates = new Set();
  t.packing.forEach(c=>(c.templates||[]).forEach(tpl=>{ if(tpl.excluded) stagedExcludedTemplates.add(tpl.id); }));
  packCatExcludeMode = true;
  renderPackCatExcludeArea();
  renderPackCatManageList(t);
  renderPackSubManageList(t);
}
function cancelPackCatExcludeMode(){
  packCatExcludeMode = false;
  stagedExcludedCats = null;
  stagedExcludedTemplates = null;
  renderPackCatExcludeArea();
  const t = getTrip(packCatManageCtx.tripId);
  renderPackCatManageList(t);
  renderPackSubManageList(t);
}
function savePackCatExcludeMode(){
  const t = getTrip(packCatManageCtx.tripId);
  t.packing.forEach(c=>{
    c.excluded = stagedExcludedCats.has(c.id);
    (c.templates||[]).forEach(tpl=>{ tpl.excluded = stagedExcludedTemplates.has(tpl.id); });
  });
  packCatExcludeMode = false;
  stagedExcludedCats = null;
  stagedExcludedTemplates = null;
  renderPackCatExcludeArea();
  renderPackCatManageList(t);
  renderPackSubManageList(t);
}
function renderPackCatManageList(t){
  const container = document.getElementById('packCatManageList');
  const cats = t.packing || [];
  if(!cats.length){
    container.innerHTML = '<div class="empty-note">還沒有分類，請在下面新增</div>';
    return;
  }
  container.innerHTML = cats.map((c,i)=>{
    const color = PACK_CAT_DOT_COLORS[i % PACK_CAT_DOT_COLORS.length];
    const isExcluded = packCatExcludeMode ? stagedExcludedCats.has(c.id) : !!c.excluded;
    return '<div class="pack-cat-row'+(packCatManageCtx.selectedCatId===c.id?' active':'')+(isExcluded?' excluded':'')+'" data-cat-select="'+c.id+'" style="background:'+color+';">' +
      '<input type="text" class="pack-cat-rename-input" value="'+escapeHtml(c.name)+'" data-cat-rename="'+c.id+'"'+(packCatExcludeMode?' readonly':'')+'>' +
      '<span class="pack-cat-row-fill"></span>' +
      (packCatExcludeMode
        ? '<div class="pack-cat-exclude-check'+(isExcluded?' checked':'')+'" data-cat-exclude-toggle="'+c.id+'">'+(isExcluded?'✓':'')+'</div>'
        : '<button class="btn-icon btn-sm icon-danger" data-cat-del="'+c.id+'">✕</button>') +
    '</div>';
  }).join('');
  if(packCatExcludeMode){
    container.querySelectorAll('[data-cat-select]').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('[data-cat-exclude-toggle]')) return;
        packCatManageCtx.selectedCatId = row.dataset.catSelect;
        renderPackCatManageList(t);
        renderPackSubManageList(t);
      });
    });
    container.querySelectorAll('[data-cat-exclude-toggle]').forEach(chk=>{
      chk.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = chk.dataset.catExcludeToggle;
        if(stagedExcludedCats.has(id)) stagedExcludedCats.delete(id); else stagedExcludedCats.add(id);
        renderPackCatManageList(t);
      });
    });
    return;
  }
  container.querySelectorAll('[data-cat-select]').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('input,button')) return;
      packCatManageCtx.selectedCatId = row.dataset.catSelect;
      renderPackCatManageList(t);
      renderPackSubManageList(t);
    });
  });
  container.querySelectorAll('[data-cat-rename]').forEach(inp=>{
    inp.addEventListener('click', (e)=> e.stopPropagation());
    inp.addEventListener('change', async ()=>{
      const cat = t.packing.find(c=>c.id===inp.dataset.catRename);
      if(cat && inp.value.trim()){ cat.name = inp.value.trim(); }
    });
  });
  container.querySelectorAll('[data-cat-del]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(t.packing.length<=1){ showToast('至少要保留一個分類'); return; }
      const wasSelected = packCatManageCtx.selectedCatId===btn.dataset.catDel;
      t.packing = t.packing.filter(c=>c.id!==btn.dataset.catDel);
      if(wasSelected) packCatManageCtx.selectedCatId = t.packing.length ? t.packing[0].id : null;
      renderPackCatManageList(t);
      renderPackSubManageList(t);
    });
  });
}
function renderPackSubManageList(t){
  const container = document.getElementById('packSubManageList');
  const titleEl = document.getElementById('packSubManageTitle');
  const cat = t.packing.find(c=>c.id===packCatManageCtx.selectedCatId);
  if(!cat){
    titleEl.textContent = '小項目';
    container.innerHTML = '<div class="empty-note">請先在左邊選一個大項目</div>';
    return;
  }
  titleEl.textContent = '小項目（'+cat.name+'）';
  const templates = cat.templates || [];
  if(!templates.length){
    container.innerHTML = '<div class="empty-note">還沒有小項目，請在下面新增</div>';
  } else {
    container.innerHTML = templates.map(tpl=>{
      const isExcluded = packCatExcludeMode ? stagedExcludedTemplates.has(tpl.id) : !!tpl.excluded;
      return '<div class="pack-sub-row'+(isExcluded?' excluded':'')+'" data-sub-select="'+tpl.id+'">' +
        '<input type="text" class="pack-sub-rename-input" value="'+escapeHtml(tpl.name)+'" data-sub-rename="'+tpl.id+'"'+(packCatExcludeMode?' readonly':'')+'>' +
        (packCatExcludeMode ? '' : '<button class="btn-icon btn-sm icon-danger" data-sub-del="'+tpl.id+'">✕</button>') +
      '</div>';
    }).join('');
  }
  if(packCatExcludeMode){
    container.querySelectorAll('[data-sub-select]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const id = row.dataset.subSelect;
        if(stagedExcludedTemplates.has(id)) stagedExcludedTemplates.delete(id); else stagedExcludedTemplates.add(id);
        renderPackSubManageList(t);
      });
    });
    return;
  }
  container.querySelectorAll('[data-sub-rename]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const tpl = cat.templates.find(x=>x.id===inp.dataset.subRename);
      if(tpl && inp.value.trim()){ tpl.name = inp.value.trim(); }
    });
  });
  container.querySelectorAll('[data-sub-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      cat.templates = cat.templates.filter(x=>x.id!==btn.dataset.subDel);
      renderPackCatManageList(t);
      renderPackSubManageList(t);
    });
  });
}
function openPackCatManageModal(t){
  packCatManageCtx = {tripId: t.id, selectedCatId: t.packing.length ? t.packing[0].id : null};
  packCatExcludeMode = false;
  stagedExcludedCats = null;
  stagedExcludedTemplates = null;
  renderPackCatExcludeArea();
  renderPackCatManageList(t);
  renderPackSubManageList(t);
  document.getElementById('packCatManageNewInput').value = '';
  document.getElementById('packSubManageNewInput').value = '';
  document.getElementById('packCatManageModalOverlay').classList.add('active');
}
function closePackCatManageModal(){
  document.getElementById('packCatManageModalOverlay').classList.remove('active');
  packCatManageCtx = null;
  packCatExcludeMode = false;
  stagedExcludedCats = null;
  stagedExcludedTemplates = null;
  renderTripList();
}
async function saveAndClosePackCatManageModal(){
  await saveTrips();
  closePackCatManageModal();
}
async function addPackCatFromManage(){
  if(!packCatManageCtx || packCatExcludeMode) return;
  const t = getTrip(packCatManageCtx.tripId);
  const input = document.getElementById('packCatManageNewInput');
  const name = input.value.trim();
  if(!name) return;
  const cat = {id:genId(), name, items:[], templates:[]};
  t.packing.push(cat);
  input.value = '';
  packCatManageCtx.selectedCatId = cat.id;
  renderPackCatManageList(t);
  renderPackSubManageList(t);
}
async function addPackSubFromManage(){
  if(!packCatManageCtx || !packCatManageCtx.selectedCatId || packCatExcludeMode) return;
  const t = getTrip(packCatManageCtx.tripId);
  const cat = t.packing.find(c=>c.id===packCatManageCtx.selectedCatId);
  if(!cat) return;
  const nameInput = document.getElementById('packSubManageNewInput');
  const name = nameInput.value.trim();
  if(!name) return;
  if(!cat.templates) cat.templates = [];
  cat.templates.push({id:genId(), name});
  nameInput.value = '';
  renderPackCatManageList(t);
  renderPackSubManageList(t);
}

/* ---------- pack item edit ---------- */
let packAddItemCtx = null; // {tripId, staged: []}
function refreshPackAddItemSub(t, preserveSelection){
  const catSel = document.getElementById('packAddItemCat');
  const subSel = document.getElementById('packAddItemSub');
  const personSel = document.getElementById('packAddItemPerson');
  const cat = t.packing.find(c=>c.id===catSel.value);
  const person = personSel ? personSel.value : null;
  const currentText = preserveSelection ? subSel.value : null;
  let excludeNames = [];
  if(cat && person && person!=='__all__'){
    excludeNames = cat.items.filter(i=>i.owner===person).map(i=>i.text);
  }
  if(packAddItemCtx){
    const stagedNames = packAddItemCtx.staged
      .filter(s=> s.catId===catSel.value && (s.person===person || s.person==='__all__' || person==='__all__'))
      .map(s=>s.text);
    excludeNames = excludeNames.concat(stagedNames);
  }
  subSel.innerHTML = subSelectOptionsHtml(cat, currentText, excludeNames);
}
function ownerWithAllOptionsHtml(owners, selected){
  return owners.map(p=>'<option value="'+escapeHtml(p)+'"'+(p===selected?' selected':'')+'>'+escapeHtml(p)+'</option>').join('') +
    '<option value="__all__"'+(selected==='__all__'?' selected':'')+'>全選（所有參與者）</option>';
}
function renderPackAddItemStagedList(t){
  const container = document.getElementById('packAddItemStagedList');
  const staged = packAddItemCtx ? packAddItemCtx.staged : [];
  if(!staged.length){
    container.innerHTML = '<div class="empty-note">還沒有加入任何項目</div>';
    return;
  }
  const owners = (packAddItemCtx && packAddItemCtx.personOptions) ? packAddItemCtx.personOptions
    : ((t.participants && t.participants.length) ? t.participants : peopleList());
  container.innerHTML = staged.map(s=>{
    const cat = t.packing.find(c=>c.id===s.catId);
    return '<div class="pack-manage-row" data-staged-row="'+s.id+'">' +
      '<select class="pack-manage-cat" data-staged-cat="'+s.id+'">'+catSelectOptionsHtml(t.packing, s.catId)+'</select>' +
      '<select class="pack-manage-sub" data-staged-sub="'+s.id+'">'+subSelectOptionsHtml(cat, s.text)+'</select>' +
      '<select class="pack-manage-qty" data-staged-qty="'+s.id+'">'+qtyOptionsHtml(s.qty)+'</select>' +
      '<select class="pack-manage-person" data-staged-person="'+s.id+'">'+ownerWithAllOptionsHtml(owners, s.person)+'</select>' +
      '<button class="btn-icon btn-sm icon-danger" data-staged-del="'+s.id+'">✕</button>' +
    '</div>';
  }).join('');
  container.querySelectorAll('[data-staged-cat]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const s = packAddItemCtx.staged.find(x=>x.id===sel.dataset.stagedCat);
      if(!s) return;
      const newCat = t.packing.find(c=>c.id===sel.value);
      s.catId = sel.value;
      s.catName = newCat ? newCat.name : '';
      s.text = (newCat && newCat.templates && newCat.templates[0]) ? newCat.templates[0].name : '';
      renderPackAddItemStagedList(t);
    });
  });
  container.querySelectorAll('[data-staged-sub]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const s = packAddItemCtx.staged.find(x=>x.id===sel.dataset.stagedSub);
      if(s) s.text = sel.value;
    });
  });
  container.querySelectorAll('[data-staged-qty]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const s = packAddItemCtx.staged.find(x=>x.id===sel.dataset.stagedQty);
      if(s) s.qty = Number(sel.value)||1;
    });
  });
  container.querySelectorAll('[data-staged-person]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const s = packAddItemCtx.staged.find(x=>x.id===sel.dataset.stagedPerson);
      if(s) s.person = sel.value;
    });
  });
  container.querySelectorAll('[data-staged-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      packAddItemCtx.staged = packAddItemCtx.staged.filter(x=>x.id!==btn.dataset.stagedDel);
      renderPackAddItemStagedList(t);
      refreshPackAddItemSub(t);
    });
  });
}
function openPackAddItemModal(t, defaultPerson){
  const owners = (t.participants && t.participants.length) ? t.participants : peopleList();
  const restrictToPerson = (defaultPerson && owners.includes(defaultPerson)) ? defaultPerson : null;
  const personOptions = restrictToPerson ? [restrictToPerson] : owners;
  packAddItemCtx = {tripId: t.id, staged: [], personOptions};
  document.getElementById('packAddItemCat').innerHTML = catSelectOptionsHtml(t.packing, t.packing[0] ? t.packing[0].id : null);
  document.getElementById('packAddItemQty').innerHTML = qtyOptionsHtml(1);
  document.getElementById('packAddItemPerson').innerHTML = ownerWithAllOptionsHtml(personOptions, restrictToPerson || personOptions[0]);
  refreshPackAddItemSub(t);
  renderPackAddItemStagedList(t);
  document.getElementById('packAddItemModalOverlay').classList.add('active');
}
function closePackAddItemModal(){
  document.getElementById('packAddItemModalOverlay').classList.remove('active');
  packAddItemCtx = null;
}
function stagePackAddItem(){
  if(!packAddItemCtx) return;
  const t = getTrip(packAddItemCtx.tripId);
  const catSel = document.getElementById('packAddItemCat');
  const subSel = document.getElementById('packAddItemSub');
  const qtySel = document.getElementById('packAddItemQty');
  const personSel = document.getElementById('packAddItemPerson');
  const cat = t.packing.find(c=>c.id===catSel.value);
  if(!cat || !subSel.value){ showToast('請先在編輯分類新增小項目'); return; }
  packAddItemCtx.staged.push({
    id: genId(), catId: cat.id, catName: cat.name, text: subSel.value,
    qty: Number(qtySel.value)||1, person: personSel.value
  });
  renderPackAddItemStagedList(t);
  refreshPackAddItemSub(t);
}
function buildPackAddPlan(t, staged){
  const owners = (t.participants && t.participants.length) ? t.participants : peopleList();
  const plan = [];
  staged.forEach(s=>{
    const targets = s.person==='__all__' ? owners : [s.person];
    targets.forEach(person=>{
      plan.push({ stagedId:s.id, catId:s.catId, text:s.text, qty:s.qty, person });
    });
  });
  return plan;
}
async function commitPackAddPlan(plan, skipKeys){
  skipKeys = skipKeys || new Set();
  const t = getTrip(packAddItemCtx.tripId);
  plan.forEach(p=>{
    if(skipKeys.has(p.stagedId+'::'+p.person)) return;
    const cat = t.packing.find(c=>c.id===p.catId);
    if(!cat) return;
    cat.items.push({id:genId(), text:p.text, owner:p.person, checked:false, qty:p.qty});
  });
  await saveTrips();
  closePackAddItemModal();
  closePackDupConfirmModal();
  renderTripList();
}
async function savePackAddItemStaged(){
  if(!packAddItemCtx || !packAddItemCtx.staged.length){ showToast('清單是空的'); return; }
  const t = getTrip(packAddItemCtx.tripId);
  const plan = buildPackAddPlan(t, packAddItemCtx.staged);
  const conflicts = [];
  plan.forEach(p=>{
    const cat = t.packing.find(c=>c.id===p.catId);
    if(!cat) return;
    const others = cat.items.filter(i=>i.owner && i.owner!==p.person && i.text===p.text);
    const otherOwners = [...new Set(others.map(i=>i.owner))];
    if(otherOwners.length){
      conflicts.push({ key:p.stagedId+'::'+p.person, text:p.text, person:p.person, otherOwners });
    }
  });
  if(conflicts.length){
    openPackDupConfirmModal(plan, conflicts);
    return;
  }
  await commitPackAddPlan(plan);
}
let pendingPackPlan = null;
function openPackDupConfirmModal(plan, conflicts){
  pendingPackPlan = { plan, choices:{} };
  conflicts.forEach(c=>{ pendingPackPlan.choices[c.key] = true; });
  pendingPackPlan.conflicts = conflicts;
  renderPackDupConfirmList();
  document.getElementById('packDupConfirmModalOverlay').classList.add('active');
}
function closePackDupConfirmModal(){

}
function renderPackDupConfirmList(){

let packPersonManageCtx = null; // {tripId, person}
function catSelectOptionsHtml(cats, selectedId){
  return cats.filter(c=>!c.excluded || c.id===selectedId)
    .map(c=>'<option value="'+c.id+'"'+(c.id===selectedId?' selected':'')+'>'+escapeHtml(c.name)+(c.excluded?'（不攜帶）':'')+'</option>').join('');
}
function subSelectOptionsHtml(cat, currentText, excludeNames){
  excludeNames = excludeNames || [];
  const allTemplates = (cat && cat.templates) || [];
  const templates = allTemplates.filter(tpl=>
    (!tpl.excluded || tpl.name===currentText) &&
    (tpl.name===currentText || !excludeNames.includes(tpl.name))
  );
  let html = '';
  if(currentText && !templates.some(tpl=>tpl.name===currentText)){
    html += '<option value="'+escapeHtml(currentText)+'" selected>'+escapeHtml(currentText)+'</option>';
  }
  if(!templates.length){
    html += '<option value="" disabled'+(!currentText?' selected':'')+'>尚無小項目，請先在左邊新增</option>';
  } else {
    templates.forEach(tpl=>{
      html += '<option value="'+escapeHtml(tpl.name)+'"'+(tpl.name===currentText?' selected':'')+'>'+escapeHtml(tpl.name)+(tpl.excluded?'（不攜帶）':'')+'</option>';
    });
  }
  return html;
}
function findPackItem(t, itemId){
  let found = null, foundCat = null;
  (t.packing||[]).forEach(cat=>{ const it = cat.items.find(i=>i.id===itemId); if(it){ found = it; foundCat = cat; } });
  return found ? {item:found, cat:foundCat} : null;
}
function findPackItemsByOwner(t, scope){
  const owners = (t.participants && t.participants.length) ? t.participants : peopleList();
  const out = [];
  (t.packing||[]).forEach(cat=>{
    cat.items.forEach(item=>{
      let match;
      if(scope==='__unassigned__') match = !item.owner || (!owners.includes(item.owner) && item.owner!=='__all__');
      else match = item.owner===scope;
      if(match) out.push({item, cat});
    });
  });
  return out;
}
function ownerFullOptionsHtml(owners, selected){
  let html = owners.map(p=>'<option value="'+escapeHtml(p)+'"'+(p===selected?' selected':'')+'>'+escapeHtml(p)+'</option>').join('');
  html += '<option value="__all__"'+(selected==='__all__'?' selected':'')+'>全選（所有參與者）</option>';
  html += '<option value=""'+(!selected?' selected':'')+'>未分配</option>';
  return html;
}
function renderPackPersonManageList(t){

  const owners = (t.participants && t.participants.length) ? t.participants : peopleList();
