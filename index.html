    container.innerHTML = '<div class="empty-note">還沒有項目，請在下面新增</div>';
  } else {
    container.innerHTML = pairs.map(({item, cat})=>
      '<div class="pack-manage-row" data-manage-item="'+item.id+'">' +
        '<select class="pack-manage-cat" data-manage-cat="'+item.id+'">'+catSelectOptionsHtml(t.packing, cat.id)+'</select>' +
        '<select class="pack-manage-sub" data-manage-sub="'+item.id+'">'+subSelectOptionsHtml(cat, item.text)+'</select>' +
        '<select class="pack-manage-qty" data-manage-qty="'+item.id+'">'+qtyOptionsHtml(item.qty||1)+'</select>' +
        '<select class="pack-manage-person" data-manage-owner="'+item.id+'">'+ownerFullOptionsHtml(owners, item.owner)+'</select>' +
        '<button class="btn-icon btn-sm icon-danger" data-manage-del="'+item.id+'">✕</button>' +
      '</div>'
    ).join('');

      const newCat = t.packing.find(c=>c.id===sel.value);
      if(!newCat || newCat===found.cat) return;
      found.cat.items = found.cat.items.filter(i=>i.id!==itemId);
      newCat.items.push(found.item);
      // reset item's small-item name since templates differ per category
      found.item.text = (newCat.templates && newCat.templates[0]) ? newCat.templates[0].name : '';
      await saveTrips();
      renderPackPersonManageList(t);
    });
  });
  container.querySelectorAll('[data-manage-sub]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const found = findPackItem(t, sel.dataset.manageSub);
      if(!found) return;
      found.item.text = sel.value;
      await saveTrips();
    });
  });
  container.querySelectorAll('[data-manage-qty]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const found = findPackItem(t, sel.dataset.manageQty);
      if(!found) return;
      found.item.qty = Number(sel.value)||1;
      await saveTrips();
    });
  });
  container.querySelectorAll('[data-manage-owner]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const found = findPackItem(t, sel.dataset.manageOwner);
      if(!found) return;
      found.item.owner = sel.value;
      await saveTrips();
      renderPackPersonManageList(t);
    });
  });
  container.querySelectorAll('[data-manage-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const found = findPackItem(t, btn.dataset.manageDel);
      if(!found) return;
      found.cat.items = found.cat.items.filter(i=>i.id!==btn.dataset.manageDel);
      await saveTrips();
      renderPackPersonManageList(t);
    });
  });
}

function catInfo(key){ return EXPENSE_CATS.find(c=>c.key===key) || EXPENSE_CATS[EXPENSE_CATS.length-1]; }
function effectiveAmount(e){ return e.type==='refund' ? -(e.amount||0) : (e.amount||0); }
function ledgerHtml(t){
  const list = (t.ledger||[]).slice().sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    return da<db?1:(da>db?-1:0);
  });
  const total = list.reduce((s,e)=>s+effectiveAmount(e),0);
  let html = '<div class="ledger-total-row"><div><div class="ledger-total-label">這趟旅程總花費</div><div class="ledger-total-val">NT$ '+fmt(total)+'</div></div>' +
    '<button class="btn btn-primary" id="btnAddExpense">+ 新增消費</button></div>';
  if(!list.length){
    html += '<div class="trip-empty">還沒有記帳紀錄</div>';
    return html;
  }
  let lastDate = null;
  list.forEach(e=>{
    if(e.date !== lastDate){
      html += '<div class="ledger-day-head">'+(e.date ? shortDate(e.date)+'（'+weekdayLabel(e.date)+'）' : '未記錄日期')+'</div>';
      lastDate = e.date;
    }
    const c = catInfo(e.category);
    const isRefund = e.type==='refund';
    html += '<div class="tx-row" data-expense="'+e.id+'">' +
      '<span class="tag" style="background:'+c.color+';">'+c.label+'</span>' +
      '<span class="tx-note">'+escapeHtml(e.note||'')+'</span>' +
      (e.payer ? '<span class="tx-payer">👤 '+escapeHtml(e.payer)+'</span>' : '') +
      '<span class="tx-amt'+(isRefund?' tx-amt-refund':'')+'">'+(isRefund?'+':'')+'NT$ '+fmt(e.amount)+'</span>' +
    '</div>';
  });
  return html;
}

/* ================= PANEL EVENT BINDING ================= */
function bindPanelEvents(t, panel){
  const el = panel;

  // overview calendar
  bindOverviewCalendarEvents(t, el);

  // overview
  el.querySelectorAll('[data-add-item]').forEach(btn=>{
    btn.addEventListener('click', ()=> openItemModal(t, null, btn.dataset.addItem));
  });
  el.querySelectorAll('[data-edit-item]').forEach(btn=>{
    btn.addEventListener('click', ()=> openItemModal(t, btn.dataset.editItem, null));
  });
  el.querySelectorAll('[data-edit-day]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.editDay;
      if(itineraryEditDays.has(key)){
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner-sm"></span>儲存中';
        await saveTrips();
        itineraryEditDays.delete(key);
        renderTripList();
      } else {
        itineraryEditDays.add(key);
        renderTripList();
      }
    });
  });
  el.querySelectorAll('[data-draggable-item]').forEach(row=>{
    row.addEventListener('dragstart', (e)=>{
      draggedItemId = row.dataset.draggableItem;
      if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      const rect = row.getBoundingClientRect();
      const isTopHalf = (e.clientY - rect.top) < rect.height/2;
      row.classList.remove('drag-over-top','drag-over-bottom');
      row.classList.add(isTopHalf ? 'drag-over-top' : 'drag-over-bottom');
      row.dataset.dropPosition = isTopHalf ? 'before' : 'after';
    });
    row.addEventListener('dragleave', ()=>{
      row.classList.remove('drag-over-top','drag-over-bottom');
    });
    row.addEventListener('drop', (e)=>{
      e.preventDefault();
      const position = row.dataset.dropPosition || 'before';
      row.classList.remove('drag-over-top','drag-over-bottom');
      const targetId = row.dataset.draggableItem;
      if(!draggedItemId || draggedItemId===targetId) return;
      const draggedItem = t.itinerary.find(i=>i.id===draggedItemId);
      const targetItem = t.itinerary.find(i=>i.id===targetId);
      if(!draggedItem || !targetItem || draggedItem.date!==targetItem.date) { draggedItemId=null; return; }
      const dayItems = sortDayItems(t.itinerary.filter(i=>i.date===draggedItem.date));
      const fromIdx = dayItems.findIndex(i=>i.id===draggedItemId);
      if(fromIdx<0) { draggedItemId=null; return; }
      const [moved] = dayItems.splice(fromIdx,1);
      let toIdx = dayItems.findIndex(i=>i.id===targetId);
      if(toIdx<0){ draggedItemId=null; return; }
      if(position==='after') toIdx += 1;
      dayItems.splice(toIdx,0,moved);
      if(!isValidTimeOrder(dayItems)){
        showToast('這樣排會跟時間順序衝突，請調整到合理的位置');
        draggedItemId = null;
        renderTripList();
        return;
      }
      dayItems.forEach((it,idx)=>{ it.order = idx; });
      draggedItemId = null;
      renderTripList();
    });
    row.addEventListener('dragend', ()=>{
      draggedItemId = null;
      el.querySelectorAll('.item-row.drag-over').forEach(r=>r.classList.remove('drag-over'));
    });
  });

  // flights
  el.querySelectorAll('[data-add-flight]').forEach(btn=>{
    btn.addEventListener('click', ()=> openFlightModal(t, btn.dataset.addFlight, null));
  });
  el.querySelectorAll('[data-flight]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const found = findFlightSegment(t, card.dataset.flight);
      if(found) openFlightModal(t, found.dir, card.dataset.flight);
    });
  });

  // packing
  el.querySelectorAll('[data-toggle-pack]').forEach(chk=>{
    chk.addEventListener('click', async ()=>{
      let it = null;
      for(const cat of t.packing){
        it = cat.items.find(i=>i.id===chk.dataset.togglePack);
        if(it){ it.checked = !it.checked; break; }
      }
      if(!it) return;
      chk.classList.toggle('checked', it.checked);
      chk.textContent = it.checked ? '✓' : '';
      await saveTrips();
      renderTripList();
    });
  });
  el.querySelectorAll('[data-del-pack]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      t.packing.forEach(cat=>{ cat.items = cat.items.filter(i=>i.id!==btn.dataset.delPack); });
      await saveTrips();
      renderTripList();
    });
  });
  el.querySelectorAll('[data-del-cat]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const cat = t.packing.find(c=>c.id===btn.dataset.delCat);
      if(cat && await showConfirm('刪除「'+cat.name+'」這個分類（含所有項目）？')){
        t.packing = t.packing.filter(c=>c.id!==btn.dataset.delCat);
        await saveTrips();
        renderTripList();
      }
    });
  });
  const btnEditPackCat = el.querySelector('#btnEditPackCat');
  if(btnEditPackCat) btnEditPackCat.addEventListener('click', ()=> openPackCatManageModal(t));
  el.querySelectorAll('[data-manage-person]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openPackPersonManageModal(t, btn.dataset.managePerson); });
  });
  el.querySelectorAll('[data-add-person-item]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openPackAddItemModal(t, btn.dataset.addPersonItem); });
  });
  el.querySelectorAll('[data-toggle-person]').forEach(head=>{
    head.addEventListener('click', (e)=>{
      if(e.target.closest('[data-add-person-item],[data-manage-person]')) return;
      togglePackExpanded(t.id, head.dataset.togglePerson);
    });
  });

  // ledger
  const btnAddExpense = el.querySelector('#btnAddExpense');
  if(btnAddExpense) btnAddExpense.addEventListener('click', ()=> openExpenseModal(t, null));
  el.querySelectorAll('[data-expense]').forEach(row=>{
    row.addEventListener('click', ()=> openExpenseModal(t, row.dataset.expense));
  });

  // todo
  el.querySelectorAll('[data-todo-add-btn]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const textInput = el.querySelector('[data-todo-add-text]');
      const ownerSel = el.querySelector('[data-todo-add-owner]');
      const dateInput = el.querySelector('[data-todo-add-date]');
      const text = textInput.value.trim();
      if(!text) return;
      t.todos.push({id:genId(), text, owner: ownerSel?ownerSel.value:'', checked:false, dueDate: dateInput?(dateInput.value||null):null});
      await saveTrips();
      renderTripList();
    });
  });
  el.querySelectorAll('[data-todo-add-text]').forEach(input=>{
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') el.querySelector('[data-todo-add-btn]').click(); });
  });
  el.querySelectorAll('[data-todo-add-date]').forEach(inp=>{
    inp.addEventListener('click', function(){ if(this.showPicker){ try{ this.showPicker(); }catch(e){} } });
  });
  el.querySelectorAll('[data-edit-todo]').forEach(btn=>{
    btn.addEventListener('click', ()=> openTodoItemModal(t, btn.dataset.editTodo));
  });
  el.querySelectorAll('[data-toggle-todo]').forEach(chk=>{
    chk.addEventListener('click', async ()=>{
      const it = t.todos.find(i=>i.id===chk.dataset.toggleTodo);
      if(!it) return;
      it.checked = !it.checked;
      chk.classList.toggle('checked', it.checked);
      chk.textContent = it.checked ? '✓' : '';
      await saveTrips();
      renderTripList();
    });
  });
}

async function saveItemModal(){
  const title = document.getElementById('itemTitleInput').value.trim();
  if(!title){ showToast('請輸入行程項目'); return; }
  const time = document.getElementById('itemTimeInput').value || '';
  const note = document.getElementById('itemNoteInput').value.trim();
  const t = getTrip(itemModalCtx.tripId);
  if(itemModalCtx.editId){
    const it = t.itinerary.find(i=>i.id===itemModalCtx.editId);
    it.title=title; it.time=time; it.note=note; it.starred=itemModalStarred;
  } else {
    const newItem = {id:genId(), date:itemModalCtx.dayIso, time, title, note, starred:itemModalStarred};
    const dayItems = t.itinerary.filter(i=>i.date===itemModalCtx.dayIso);
    if(dayItems.some(it=>it.order!=null)){
      const sorted = sortDayItems(dayItems);
      let insertAt = sorted.length;
      if(time){
        const idx = sorted.findIndex(it=>it.time && it.time > time);
        if(idx>=0) insertAt = idx;
      }
      sorted.splice(insertAt, 0, newItem);
      sorted.forEach((it,idx)=>{ it.order = idx; });
    }
    t.itinerary.push(newItem);
  }
  await saveTrips();
  closeItemModal();
  renderTripList();

let wheelModalCtx = null; // {onConfirm(hh,mm)}
const WHEEL_HOUR_VALUES = Array.from({length:24}, (_,i)=>i);
const WHEEL_MINUTE_VALUES = [5,10,15,20,25,30,35,40,45,50,55,0];
function nearestMinuteStep(m){
  let best = WHEEL_MINUTE_VALUES[0], bestDist = Infinity;
  WHEEL_MINUTE_VALUES.forEach(v=>{
    const d = Math.min(Math.abs(v-m), 60-Math.abs(v-m));
    if(d<bestDist){ bestDist=d; best=v; }
  });
  return best;
}
let wheelSelectedHour = 0, wheelSelectedMinute = 0;
const wheelScrollTimers = new WeakMap();
function buildWheelColumn(container, values, selected, onPick){
  container.innerHTML = '';
  container.appendChild(Object.assign(document.createElement('div'), {className:'wheel-spacer'}));
  values.forEach(i=>{
    const item = document.createElement('div');
    item.className = 'wheel-item' + (i===selected ? ' center' : '');
    item.textContent = pad2(i);
    item.dataset.val = String(i);
    item.addEventListener('click', ()=>{
      onPick(i);
      if(item.scrollIntoView) item.scrollIntoView({block:'center', behavior:'smooth'});
    });
    container.appendChild(item);
  });
  container.appendChild(Object.assign(document.createElement('div'), {className:'wheel-spacer'}));
}
function refreshWheelHighlight(container, selected){
  container.querySelectorAll('.wheel-item').forEach(it=>{
    it.classList.toggle('center', Number(it.dataset.val)===selected);
  });
}
function bindWheelScroll(container, onPick){
  container.addEventListener('scroll', ()=>{
    clearTimeout(wheelScrollTimers.get(container));
    wheelScrollTimers.set(container, setTimeout(()=>{
      const rect = container.getBoundingClientRect();
      const centerY = rect.top + rect.height/2;
      let closest = null, closestDist = Infinity;
      container.querySelectorAll('.wheel-item').forEach(it=>{
        const r = it.getBoundingClientRect();
        const d = Math.abs((r.top + r.height/2) - centerY);
        if(d < closestDist){ closestDist = d; closest = it; }
      });
      if(closest) onPick(Number(closest.dataset.val));
    }, 120));
  });
}
const WHEEL_ITEM_HEIGHT = 36;
function bindWheelMouseStep(container){
  container.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const dir = e.deltaY > 0 ? 1 : -1;
    container.scrollBy({top: dir * WHEEL_ITEM_HEIGHT, behavior:'smooth'});
  }, {passive:false});
}
let wheelListenersBound = false;
function openWheelTimeModal(title, initHH, initMM, onConfirm){
  wheelModalCtx = {onConfirm};
  wheelSelectedHour = initHH; wheelSelectedMinute = nearestMinuteStep(initMM);
  document.getElementById('wheelTimeModalTitle').textContent = title;
  const hourCol = document.getElementById('wheelHourCol');
  const minCol = document.getElementById('wheelMinuteCol');
  buildWheelColumn(hourCol, WHEEL_HOUR_VALUES, wheelSelectedHour, (v)=>{ wheelSelectedHour=v; refreshWheelHighlight(hourCol, v); });
  buildWheelColumn(minCol, WHEEL_MINUTE_VALUES, wheelSelectedMinute, (v)=>{ wheelSelectedMinute=v; refreshWheelHighlight(minCol, v); });
  if(!wheelListenersBound){
    bindWheelScroll(hourCol, (v)=>{ wheelSelectedHour=v; refreshWheelHighlight(hourCol, v); });
    bindWheelScroll(minCol, (v)=>{ wheelSelectedMinute=v; refreshWheelHighlight(minCol, v); });
    bindWheelMouseStep(hourCol);
    bindWheelMouseStep(minCol);
    wheelListenersBound = true;
  }
  document.getElementById('wheelTimeModalOverlay').classList.add('active');
  setTimeout(()=>{
    const hIt = hourCol.querySelector('[data-val="'+wheelSelectedHour+'"]');
    const mIt = minCol.querySelector('[data-val="'+wheelSelectedMinute+'"]');
    if(hIt && hIt.scrollIntoView) hIt.scrollIntoView({block:'center'});
    if(mIt && mIt.scrollIntoView) mIt.scrollIntoView({block:'center'});
  }, 30);
}
function closeWheelTimeModal(){
  document.getElementById('wheelTimeModalOverlay').classList.remove('active');
  wheelModalCtx = null;
}
function confirmWheelTimeModal(){
  if(wheelModalCtx && wheelModalCtx.onConfirm) wheelModalCtx.onConfirm(wheelSelectedHour, wheelSelectedMinute);
  closeWheelTimeModal();
}

function exportBackup(){
  const backup = {app:'好旅伴', exportedAt:new Date().toISOString(), trips: state.trips, homeTodos: state.homeTodos, people: state.people};
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '好旅伴備份_'+todayIso()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已匯出備份');
}
async function handleImportBackupFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  let backup;
  try{
    const text = await file.text();
    backup = JSON.parse(text);
  }catch(err){ showToast('備份檔格式錯誤'); return; }
  if(!backup || !Array.isArray(backup.trips)){ showToast('這不是好旅伴的備份檔'); return; }
  if(!(await showConfirm('匯入將會覆蓋目前所有旅遊計畫，確定要繼續嗎？'))) return;
  state.trips = backup.trips;
  state.homeTodos = Array.isArray(backup.homeTodos) ? backup.homeTodos : [];
  state.people = Array.isArray(backup.people) ? backup.people : state.people;
  state.trips.forEach((t,idx)=>{
    if(!t.color) t.color = TRIP_PALETTE[idx % TRIP_PALETTE.length];
    if(!t.itinerary) t.itinerary = [];
    if(!t.flights) t.flights = {outbound:[], return:[], domestic:[]};
    if(!t.flights.domestic) t.flights.domestic = [];
    if(!t.packing) t.packing = PACK_CATS_DEFAULT.map(c=>({id:genId(), name:c, items:[], templates:[]}));
    (t.packing||[]).forEach(cat=>{ if(!cat.templates) cat.templates = []; });
    if(!t.ledger) t.ledger = [];
    if(!t.todos) t.todos = [];
    if(!t.participants) t.participants = peopleList().slice();
  });
  await saveTrips();
  await Store.setHomeTodos(state.homeTodos);
  await Store.setPeople(state.people);
  refreshHomeTodoAssigneeOptions();
  renderApp();
  showToast('已匯入備份');
}

/* ================= INIT ================= */
async function init(){
  wireEvents();
  state.trips = await Store.getTrips();
  state.homeTodos = await Store.getHomeTodos();
  state.people = await Store.getPeople();
  if(!state.people.length){
    state.people = DEFAULT_PEOPLE.slice();
    await Store.setPeople(state.people);
  }
  state.airlines = await Store.getAirlines();
  // backfill color / sub-structures for any legacy records
  state.trips.forEach((t,idx)=>{
    if(!t.color) t.color = TRIP_PALETTE[idx % TRIP_PALETTE.length];
    if(!t.itinerary) t.itinerary = [];
    if(!t.flights) t.flights = {outbound:[], return:[], domestic:[]};
    if(!t.flights.domestic) t.flights.domestic = [];
    if(!t.packing) t.packing = PACK_CATS_DEFAULT.map(c=>({id:genId(), name:c, items:[], templates:[]}));
    (t.packing||[]).forEach(cat=>{ if(!cat.templates) cat.templates = []; });
    if(!t.ledger) t.ledger = [];
    if(!t.todos) t.todos = [];
    if(!t.participants) t.participants = peopleList().slice();
  });
  // one-time import of existing 好智帳 ledger records for the 埃及 trip
  let egyptTrip = state.trips.find(t=>t.name==='埃及');
  if(!egyptTrip){
    egyptTrip = {
      id: genId(), name:'埃及', startDate:'2026-09-18', endDate:'2026-09-27',
      color: TRIP_PALETTE[state.trips.length % TRIP_PALETTE.length],
      itinerary: [], flights: {outbound:[], return:[], domestic:[]},
      packing: PACK_CATS_DEFAULT.map(c=>({id:genId(), name:c, items:[], templates:[]})),
      ledger: [], todos: [], participants: peopleList().slice()
    };
    state.trips.push(egyptTrip);
  }
  if(!egyptTrip._importedHaoZhiZhang){
    HAOZHIZHANG_EGYPT_LEDGER_SEED.forEach(rec=>{
      egyptTrip.ledger.push(Object.assign({id:genId()}, rec));
    });
    egyptTrip._importedHaoZhiZhang = true;
    await saveTrips();
  }
  // one-time migration: move existing home-page todos into the 埃及 trip's todo tab
  if(!egyptTrip._migratedHomeTodos){
    if(state.homeTodos.length){
      state.homeTodos.forEach(ht=>{
        egyptTrip.todos.push({id:genId(), text:ht.text, owner:ht.assignee||'', checked:!!ht.checked, dueDate:ht.dueDate||null});
      });
      state.homeTodos = [];
      await Store.setHomeTodos(state.homeTodos);
    }
    egyptTrip._migratedHomeTodos = true;
    await saveTrips();
  }
  refreshHomeTodoAssigneeOptions();
  // default expand/collapse: trips shorter than a month auto-expand their overview
  state.trips.forEach(t=>{
    if(isShortTrip(t) && !(t.id in expandedTab)) expandedTab[t.id] = 'overview';
  });
  renderApp();
  document.getElementById('loadingScreen').style.display = 'none';
}

function armSlowLoadHint(){
  setTimeout(()=>{
    const loadingScreen = document.getElementById('loadingScreen');
    if(loadingScreen && loadingScreen.style.display !== 'none'){
      loadingScreen.querySelector('.spinner').insertAdjacentHTML('afterend','<div style="font-size:11px;color:var(--text-faint);font-family:var(--mono);">載入時間有點長，可能是網路不穩，試試看重新整理頁面</div>');
    }
  }, 12000);
}

/* ---------------- Google Drive storage (shared) ----------------
   Everyone who opens this app signs in with their own Google account, but
   they all read/write the SAME Drive file (found by name). Share that file
   with each other's Google account (normal Drive "Share" dialog, Editor
   access) so co-editing actually works.
   TODO Josh: fill in your OAuth Client ID from Google Cloud Console. You
   can reuse the same OAuth client you made for Strength Ledger — just add
   this app's URL as an extra "Authorized redirect URI" on it (the
   "Authorized JavaScript origin" is already covered if it's the same
   github.io account). Also add the broader Drive scope below to that
   OAuth client's configured scopes, and add anyone who needs to sign in
   (including Fiona) as a test user. */
const GOOGLE_CLIENT_ID = "239888779674-h2m814mnnc19k0jgc0f50uv4ac1j8oli.apps.googleusercontent.com";
const DRIVE_FILE_NAME = "haolvban-shared-data.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
const REDIRECT_URI = window.location.origin + window.location.pathname;

let driveAccessToken = null;
let driveFileId = null;
let driveStoreCache = {};

async function driveApiFetch(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { "Authorization": "Bearer " + driveAccessToken });
  const res = await fetch(url, options);
  if(res.status === 401){ throw new Error("Google 登入已過期，請重新登入一次"); }
  if(!res.ok && res.status !== 404){ throw new Error("雲端硬碟連線失敗（" + res.status + "）"); }
  return res;
}

async function driveFindFileId(){
  const q = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
  const res = await driveApiFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id,name)&spaces=drive");
  const data = await res.json();
  if(data.files && data.files.length){ return data.files[0].id; }
  return null;
}

async function driveCreateFile(){
  const res = await driveApiFetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json" })
  });
  const data = await res.json();
  return data.id;
}

async function driveReadFile(fileId){
  const res = await driveApiFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media");
  const text = await res.text();
  if(!text){ return {}; }
  try{ return JSON.parse(text); }catch(e){ return {}; }
}

async function driveGetModifiedTime(fileId){
  const res = await driveApiFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?fields=modifiedTime");
  const data = await res.json();
  return data.modifiedTime || null;
}

async function driveWriteFile(fileId, obj){
  const res = await driveApiFetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media&fields=modifiedTime", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj)
  });
  const data = await res.json();
  return data.modifiedTime || null;
}

let driveKnownModifiedTime = null;

async function driveSaveAll(){
  if(!driveFileId) return null;

  // Conflict check: has someone else saved since we last read/wrote this file?
  try{
    const remoteModified = await driveGetModifiedTime(driveFileId);
    if(driveKnownModifiedTime && remoteModified && remoteModified !== driveKnownModifiedTime){
      const proceed = confirm(
        "偵測到雲端上的資料被別人（或其他裝置）更新過，跟你現在看到的不一樣。\n\n" +
        "按「確定」會用你目前畫面上的內容覆蓋掉雲端的最新版本；\n" +
        "按「取消」則先不存檔，建議重新整理頁面拿到最新內容後再繼續。"
      );
      if(!proceed){
        showToast('已取消儲存，建議重新整理頁面');
        return false;
      }
    }
  }catch(e){
    // if the conflict check itself fails (e.g. offline), fall through and
    // still try to save rather than blocking the user entirely
  }

  const newModifiedTime = await driveWriteFile(driveFileId, driveStoreCache);
  driveKnownModifiedTime = newModifiedTime;
  return true;
}

async function initDriveAndApp(){
  const signinScreenEl = document.getElementById("signinScreen");
  const googleBtn = document.getElementById("googleSigninBtn");
  const loadingEl = document.getElementById("signinLoading");
  const errEl = document.getElementById("signinError");
  if(googleBtn) googleBtn.style.display = "none";
  if(loadingEl) loadingEl.style.display = "block";
  if(errEl) errEl.style.display = "none";
  try{
    driveFileId = await driveFindFileId();
    if(!driveFileId){ driveFileId = await driveCreateFile(); }
    driveStoreCache = await driveReadFile(driveFileId);
    driveKnownModifiedTime = await driveGetModifiedTime(driveFileId);

    if(signinScreenEl) signinScreenEl.style.display = "none";
    const loadingScreen = document.getElementById("loadingScreen");
    if(loadingScreen) loadingScreen.style.display = "flex";
    armSlowLoadHint();
    await init();
  }catch(err){
    if(loadingEl) loadingEl.style.display = "none";
    if(googleBtn) googleBtn.style.display = "block";
    if(errEl){
      errEl.style.display = "block";
      errEl.textContent = err && err.message ? err.message : "連線失敗，請再試一次";
    }
  }
}

function startGoogleSignin(){
  const authUrl = "https://accounts.google.com/o/oauth2/v2/auth"
    + "?client_id=" + encodeURIComponent(GOOGLE_CLIENT_ID)
    + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
    + "&response_type=token"
    + "&scope=" + encodeURIComponent(DRIVE_SCOPE)
    + "&include_granted_scopes=true"
    + "&prompt=select_account";
  window.location.href = authUrl;
}

document.getElementById("googleSigninBtn").addEventListener("click", startGoogleSignin);

// If we just came back from Google's redirect, the access token is in the URL fragment.
(function checkAuthRedirect(){
  const hash = window.location.hash || "";
  if(hash.indexOf("access_token=") === -1) return;
  const params = new URLSearchParams(hash.substring(1));
  const token = params.get("access_token");
  const error = params.get("error");
  history.replaceState(null, "", window.location.pathname + window.location.search);
  if(error || !token) return;
  driveAccessToken = token;
  initDriveAndApp();
})();
})();
